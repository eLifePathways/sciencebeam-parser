# Layered onto sciencebeam-judge's own mapping by benchmarks/judge_setup.py.
#
# `abstract` is one abstract: the article's own. `abstracts` is every language the
# document carries it in, that one first. A format with nowhere to put a second says so by
# mapping both to the same thing.
#
# `abstract_legacy` is the judge's own entry under another name, so that the measure this
# replaced can still be produced by a current run.

[article]
abstract = jats-main-abstract(front/article-meta)
abstracts = jats-abstract-variants(front/article-meta)
abstract_legacy = front/article-meta/abstract

[TEI]
abstracts = tei-abstract-text(teiHeader/profileDesc/abstract)
abstract_legacy = tei-abstract-text(teiHeader/profileDesc/abstract)

[tei]
abstracts = text/front/div[@type="abstract"]
abstract_legacy = text/front/div[@type="abstract"]
