# Layered onto sciencebeam-judge's own mapping by benchmarks/judge_setup.py.
#
# `abstract` is one abstract: the article's own. `abstracts` is every language the
# document carries it in, that one first. A format with nowhere to put a second says
# so by mapping both to the same thing.

[article]
abstract = jats-main-abstract(front/article-meta)
abstracts = jats-abstract-variants(front/article-meta)

[TEI]
abstracts = tei-abstract-text(teiHeader/profileDesc/abstract)

[tei]
abstracts = text/front/div[@type="abstract"]
