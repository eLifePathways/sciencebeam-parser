# Layered onto sciencebeam-judge's own mapping by benchmarks/judge_setup.py.
#
# `abstract` is one abstract: the article's own. `abstracts` is every language the
# document carries it in, that one first. `abstract_anywhere` is a third field whose two
# sides read different entries above — see eval.yml — so it needs an entry of its own for
# the case tools to resolve, and takes the prediction side's. A format with nowhere to put
# a second abstract says so by mapping all three to the same thing.

[article]
abstract = jats-main-abstract(front/article-meta)
abstracts = jats-abstract-variants(front/article-meta)
abstract_anywhere = jats-abstract-variants(front/article-meta)

[TEI]
abstracts = tei-abstract-text(teiHeader/profileDesc/abstract)
abstract_anywhere = tei-abstract-text(teiHeader/profileDesc/abstract)

[tei]
abstracts = text/front/div[@type="abstract"]
abstract_anywhere = text/front/div[@type="abstract"]
