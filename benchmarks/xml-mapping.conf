# Layered onto sciencebeam-judge's own mapping by benchmarks/judge_setup.py.
#
# `abstract` is one abstract: the article's own. `abstracts` is every language the
# document carries it in, that one first. A format with nowhere to put a second says so by
# mapping both to the same thing.
#
# `abstract_legacy` is the judge's own entry under another name, so that the measure this
# replaced can still be produced by a current run. The entries a scored field
# does not share a name with — `abstract_anywhere` and the two per-language fields — take
# the
# prediction side of its comparison, since eval.yml names the entry each side reads and
# the case tools resolve a field name against this file.

[article]
abstract = jats-main-abstract(front/article-meta)
abstracts = jats-abstract-variants(front/article-meta)
abstract_legacy = front/article-meta/abstract
abstract_anywhere = jats-abstract-variants(front/article-meta)
abstract_any_language = jats-abstract-variants(front/article-meta)
abstract_all_languages = jats-abstract-variants(front/article-meta)

[TEI]
abstracts = tei-abstract-text(teiHeader/profileDesc/abstract)
abstract_legacy = tei-abstract-text(teiHeader/profileDesc/abstract)
abstract_anywhere = tei-abstract-text(teiHeader/profileDesc/abstract)
abstract_any_language = tei-abstract-text(teiHeader/profileDesc/abstract)
abstract_all_languages = tei-abstract-text(teiHeader/profileDesc/abstract)

[tei]
abstracts = text/front/div[@type="abstract"]
abstract_legacy = text/front/div[@type="abstract"]
abstract_anywhere = text/front/div[@type="abstract"]
abstract_any_language = text/front/div[@type="abstract"]
abstract_all_languages = text/front/div[@type="abstract"]
