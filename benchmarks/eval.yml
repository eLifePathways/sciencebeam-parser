dataset:
  repo_id: elifepathways/sciencebeam-v2-benchmarking
  revision: main
  splits:
    train:
      # The split to read closely when working out why an extraction failed, which
      # is why it is the one `run.py` defaults to.
      plos:
        repo_id: elifepathways/sciencebeam-plos-rsrch-2064-benchmark
        revision: plos-rsrch-2064-v002
        path: train/
        manifest: splits/plos-rsrch-2064-v002.csv
        stratum: journal
        id_column: id
        variant: plos-v002
        optional: true
      biorxiv:
        file: biorxiv-jats/train-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
      ore:
        file: ore-jats/train-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
      pkp:
        file: pkp-jats/train-00000-of-00001.parquet
        id_column: article_id
        variant: v1
      scielo_br:
        file: scielo_br-jats/train-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
      scielo_mx:
        file: scielo_mx-jats/train-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
      scielo_preprints-jats:
        file: scielo-preprints-jats/train-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
    validation:
      # PLOS RSRCH-2064: its own private repo, pinned to a tag because the corpus
      # grows per version and reading `main` would change every aggregate with it.
      # Balanced across 14 journals, so it is sampled per stratum rather than
      # uniformly, from the ranks its published manifest records. `optional` keeps it
      # out of a run that did not ask for it: the manuscripts are not
      # redistributable, so reaching for them is a decision, not a default.
      plos:
        repo_id: elifepathways/sciencebeam-plos-rsrch-2064-benchmark
        revision: plos-rsrch-2064-v002
        path: validation/
        manifest: splits/plos-rsrch-2064-v002.csv
        stratum: journal
        id_column: id
        variant: plos-v002
        optional: true
      biorxiv:
        file: biorxiv-jats/validation-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
      ore:
        file: ore-jats/validation-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
      pkp:
        file: pkp-jats/validation-00000-of-00001.parquet
        id_column: article_id
        variant: v1
      scielo_br:
        file: scielo_br-jats/validation-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
      scielo_mx:
        file: scielo_mx-jats/validation-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
      scielo_preprints-jats:
        file: scielo-preprints-jats/validation-00000-of-00001.parquet
        id_column: ppr_id
        variant: v1
    # Only the corpora whose numbers are meant to be published. PLOS's test
    # documents stay unexamined, which is what keeps those numbers honest, so this
    # split is for deliberate runs rather than routine ones.
    test:
      plos:
        repo_id: elifepathways/sciencebeam-plos-rsrch-2064-benchmark
        revision: plos-rsrch-2064-v002
        path: test/
        manifest: splits/plos-rsrch-2064-v002.csv
        stratum: journal
        id_column: id
        variant: plos-v002
        optional: true

# Dataset row counts at revision main:
#   biorxiv: 158, ore: 199, pkp: 200, scielo_br: 200, scielo_mx: 112, scielo_preprints-jats: 1000
# plos is sized in multiples of its 14 journals, since a sample smaller than that
# cannot contain one document from each, and being balanced across journals is the
# property the corpus was built for. Its `full` is null rather than a count because
# its splits differ in size (test 331, validation 132) and one number cannot be
# right for both.
sampling:
  smoke:
    biorxiv: 10
    ore: 10
    pkp: 10
    plos: 14
    scielo_br: 10
    scielo_mx: 10
    scielo_preprints-jats: 10
  small:
    biorxiv: 25
    ore: 25
    pkp: 25
    plos: 28
    scielo_br: 25
    scielo_mx: 25
    scielo_preprints-jats: 25
  medium:
    biorxiv: 47
    ore: 50
    pkp: 50
    plos: 56
    scielo_br: 50
    scielo_mx: 34
    scielo_preprints-jats: 50
  large:
    biorxiv: 100
    ore: 100
    pkp: 100
    plos: 140
    scielo_br: 100
    scielo_mx: 100
    scielo_preprints-jats: 100
  full:
    biorxiv: 158
    ore: 199
    pkp: 200
    plos: null   # all of whichever split is being run
    scielo_br: 200
    scielo_mx: 112
    scielo_preprints-jats: 1000

parser:
  # Per-document conversion timeout (seconds). Large PDFs can exceed the
  # default of 60s; a timeout is recorded as an error and the run continues.
  timeout_seconds: 300

seeds:
  sample: 42

fields:
  - title
  - abstract
  - author_full_names
  - affiliation_text
  - keywords
  - body_section_titles
  - acknowledgement
  - first_reference_text
  - reference_title
  - reference_doi

scoring:
  # Scoring types:
  #   string       - joins all list items with '' then compares as a single string
  #                  (appropriate for fields that are a single value in practice)
  #   ulist        - optimal item pairing regardless of order; requires equal list length
  #                  (appropriate for unordered multi-value fields, e.g. author names)
  #   partial_ulist - ulist but pads the shorter list; tolerates length mismatch
  #                  (appropriate for unordered fields with variable counts)
  #   list         - item-by-item comparison at matching positions; requires equal length
  #                  (appropriate for ordered multi-value fields)
  #   partial_list - list but pads the shorter list; tolerates length mismatch
  #                  (appropriate for ordered fields where predicted count may differ)
  default_methods:
    - levenshtein
    - edit_sim
  default_type: string
  per_field:
    title:
      methods: [exact, levenshtein, edit_sim]
    abstract:
      methods: [levenshtein, edit_sim]
    author_full_names:
      type: partial_ulist
    affiliation_text:
      type: partial_ulist
    keywords:
      type: partial_ulist
    body_section_titles:
      type: partial_list
    reference_title:
      type: partial_list
    reference_doi:
      type: partial_ulist

baselines:
  - tool: grobid
    version: 0.9.0-crf
    profile: default
  - tool: sciencebeam-parser
    version: main
    profile: grobid_crf
    generate: false
