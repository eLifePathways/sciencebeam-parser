        id_column: ppr_id
        variant: v1

# Dataset row counts at revision main:
#   biorxiv: 158, ore: 199, pkp: 200, scielo_br: 200, scielo_mx: 112, scielo_preprints-jats: 1000
sampling:
  smoke:
    biorxiv: 10
    ore: 10
    pkp: 10
    scielo_br: 10
    scielo_mx: 10
    scielo_preprints-jats: 10
  small:
    biorxiv: 25
    ore: 25
    pkp: 25
    scielo_br: 25
    scielo_mx: 25
    scielo_preprints-jats: 25
  medium:
    biorxiv: 50
    ore: 50
    pkp: 50
    scielo_br: 50
    scielo_mx: 50
    scielo_preprints-jats: 50
  large:
    biorxiv: 100
    ore: 100
    pkp: 100
    scielo_br: 100
    scielo_mx: 100
    scielo_preprints-jats: 100
  full:
    biorxiv: 158
    ore: 199
    pkp: 200
    scielo_br: 200
    scielo_mx: 112
    scielo_preprints-jats: 1000

seeds:
  sample: 42

fields:
  - title
  - abstract
  - author_full_names
  - affiliation_text
  - keywords
  - body_section_titles
  - acknowledgement
  - first_reference_text
  - reference_title
  - reference_doi

scoring:
  # Scoring types:
  #   string       - joins all list items with '' then compares as a single string
  #                  (appropriate for fields that are a single value in practice)
  #   ulist        - optimal item pairing regardless of order; requires equal list length
  #                  (appropriate for unordered multi-value fields, e.g. author names)
  #   partial_ulist - ulist but pads the shorter list; tolerates length mismatch
  #                  (appropriate for unordered fields with variable counts)
  #   list         - item-by-item comparison at matching positions; requires equal length
  #                  (appropriate for ordered multi-value fields)
  #   partial_list - list but pads the shorter list; tolerates length mismatch
  #                  (appropriate for ordered fields where predicted count may differ)
  default_methods:
    - levenshtein
    - edit_sim
  default_type: string
  per_field:
    title:
      methods: [exact, levenshtein, edit_sim]
    abstract:
      methods: [levenshtein, edit_sim]
    author_full_names:
      type: partial_ulist
    affiliation_text:
      type: partial_ulist
    keywords:
      type: partial_ulist
    body_section_titles:
      type: partial_list
    reference_title:
      type: partial_list
    reference_doi:
      type: partial_ulist

baselines:
  - tool: grobid
    version: 0.9.0-crf
