dataset:
  # Pinned rather than `main`: these corpora are rebuilt in place, so following the
  # branch would move every recorded aggregate. Tag a90f42e2d22e45c388915d16d3c20967713c4d56.
  # v002 rows are a subset of v001's, ids and xml unchanged, so `variant` stays.
  repo_id: elifepathways/sciencebeam-v2-benchmarking
  revision: benchmark-v002
  splits:
    train:
      # The split to read closely when working out why an extraction failed, which
      # is why it is the one `run.py` defaults to.
      plos-manuscripts:
        repo_id: elifepathways/sciencebeam-plos-rsrch-2064-benchmark
        revision: plos-rsrch-2064-v002
        path: train/
        manifest: splits/plos-rsrch-2064-v002.csv
        stratum: journal
        id_column: id
        variant: v002
        optional: true
      biorxiv:
        file: biorxiv-jats/train-00000-of-00001.parquet
        id_column: id
        variant: v1
      ore:
        file: ore-jats/train-00000-of-00001.parquet
        id_column: id
        variant: v1
      pkp:
        file: pkp-jats/train-00000-of-00001.parquet
        id_column: id
        variant: v2
      scielo_br:
        file: scielo_br-jats/train-00000-of-00001.parquet
        id_column: id
        variant: v1
      scielo_mx:
        file: scielo_mx-jats/train-00000-of-00001.parquet
        id_column: id
        variant: v2
      scielo_preprints-jats:
        file: scielo-preprints-jats/train-00000-of-00001.parquet
        id_column: id
        variant: v1
    validation:
      # Private repo, pinned like the others, and sampled per journal because it is
      # balanced across 14 of them. A prediction over it is close to the whole
      # manuscript, so predictions stay private too (see RepoPredictionsStore).
      plos-manuscripts:
        repo_id: elifepathways/sciencebeam-plos-rsrch-2064-benchmark
        revision: plos-rsrch-2064-v002
        path: validation/
        manifest: splits/plos-rsrch-2064-v002.csv
        stratum: journal
        id_column: id
        variant: v002
        optional: true
      biorxiv:
        file: biorxiv-jats/validation-00000-of-00001.parquet
        id_column: id
        variant: v1
      ore:
        file: ore-jats/validation-00000-of-00001.parquet
        id_column: id
        variant: v1
      pkp:
        file: pkp-jats/validation-00000-of-00001.parquet
        id_column: id
        variant: v2
      scielo_br:
        file: scielo_br-jats/validation-00000-of-00001.parquet
        id_column: id
        variant: v1
      scielo_mx:
        file: scielo_mx-jats/validation-00000-of-00001.parquet
        id_column: id
        variant: v2
      scielo_preprints-jats:
        file: scielo-preprints-jats/validation-00000-of-00001.parquet
        id_column: id
        variant: v1
    # Only the corpora whose numbers are meant to be published. PLOS's test
    # documents stay unexamined, which is what keeps those numbers honest, so this
    # split is for deliberate runs rather than routine ones.
    test:
      plos-manuscripts:
        repo_id: elifepathways/sciencebeam-plos-rsrch-2064-benchmark
        revision: plos-rsrch-2064-v002
        path: test/
        manifest: splits/plos-rsrch-2064-v002.csv
        stratum: journal
        id_column: id
        variant: v002
        optional: true

# Split sizes at benchmark-v002 (validation/train), a guide rather than a limit:
#   biorxiv 41/29, ore 58/37, pkp 132/95,
#   scielo_br 181/123, scielo_mx 39/30, scielo_preprints-jats 125/83
# A mode asking for more than a split holds takes all of it. plos-manuscripts is
# sized in multiples of its 14 journals, and its `full` is null because its splits
# differ in size.
sampling:
  smoke:
    biorxiv: 10
    ore: 10
    pkp: 10
    plos-manuscripts: 14
    scielo_br: 10
    scielo_mx: 10
    scielo_preprints-jats: 10
  small:
    biorxiv: 25
    ore: 25
    pkp: 25
    plos-manuscripts: 28
    scielo_br: 25
    scielo_mx: 25
    scielo_preprints-jats: 25
  medium:
    biorxiv: 47
    ore: 50
    pkp: 50
    plos-manuscripts: 56
    scielo_br: 50
    scielo_mx: 34
    scielo_preprints-jats: 50
  large:
    biorxiv: 100
    ore: 100
    pkp: 100
    plos-manuscripts: 140
    scielo_br: 100
    scielo_mx: 100
    scielo_preprints-jats: 100
  # null is every record of whichever split is being run. A count here would be a
  # count of some past rebuild, and would silently stop meaning "full" at the next
  # one — as it had for pkp, where 200 was 4 short of its validation split.
  full:
    biorxiv: null
    ore: null
    pkp: null
    plos-manuscripts: null
    scielo_br: null
    scielo_mx: null
    scielo_preprints-jats: null

parser:
  # Per-document conversion timeout (seconds). Below what the parser will spend, a
  # document it completed is recorded as missing; an llm profile has reached 458s.
  timeout_seconds: 900

seeds:
  sample: 42

fields:
  - title
  - title_any_case
  - title_any_language
  - title_all_languages
  - title_language
  - abstract
  - abstract_anywhere
  - abstract_any_language
  - abstract_all_languages
  - abstract_all
  - abstract_legacy
  - abstract_language
  - author_full_names
  - affiliation_text
  - affiliation_linked
  - keywords
  - body_section_titles
  - figure_labels
  - figure_captions
  - figure_label_captions
  - acknowledgement
  - first_reference_text
  - reference_title
  - reference_doi

scoring:
  # What each scoring type and field means is in doc/benchmarks.md.
  default_methods:
    - levenshtein
    - edit_sim
  default_type: string
  per_field:
    title:
      methods: [exact, levenshtein, edit_sim]
    title_any_case:
      expected: title
      actual: title
      methods: [exact, levenshtein, edit_sim]
      lower: true
    title_any_language:
      expected: titles
      actual: titles
      methods: [exact, levenshtein, edit_sim]
      type: best_match
      lower: true
    title_all_languages:
      expected: titles
      actual: titles
      methods: [exact, levenshtein, edit_sim]
      type: partial_ulist
      lower: true
    title_language:
      methods: [exact]
      type: matched_property
    abstract:
      methods: [levenshtein, edit_sim]
    abstract_anywhere:
      expected: abstract
      actual: abstracts
      methods: [levenshtein, edit_sim]
      type: best_match
    abstract_any_language:
      expected: abstracts
      actual: abstracts
      methods: [levenshtein, edit_sim]
      type: best_match
    abstract_all_languages:
      expected: abstracts
      actual: abstracts
      methods: [levenshtein, edit_sim]
      type: partial_ulist
    abstract_all:
      expected: abstracts_all
      actual: abstracts_all
      methods: [levenshtein, edit_sim]
      type: partial_ulist
    abstract_language:
      methods: [exact]
      type: matched_property
    abstract_legacy:
      methods: [levenshtein, edit_sim]
    author_full_names:
      type: partial_ulist
    affiliation_text:
      type: partial_ulist
    keywords:
      type: partial_ulist
    body_section_titles:
      type: partial_list
    figure_labels:
      type: partial_ulist
    figure_captions:
      type: partial_ulist
    figure_label_captions:
      type: partial_ulist
    reference_title:
      type: partial_list
    reference_doi:
      type: partial_ulist

baselines:
  - tool: grobid
    version: 0.9.1-crf
    profile: default
  # The profile the Benchmark workflow runs by default, so a run is compared with
  # `main` across a code change rather than a profile change as well. Store-only:
  # `main` pushes under whichever profile it was run with.
  - tool: sciencebeam-parser
    version: main
    profile: recommended
    generate: false
  # Predictions stored in sciencebeam-eval-predictions (offline run of the RL step-20
  # checkpoint on the benchmark markdown); no endpoint serves it yet. Stored for
  # `validation` only, so a run against another split finds none and skips it.
  - tool: jats-agentic-annotation
    version: qwen3.5-9b-rl-v5full-s20
    profile: default
    generate: false
