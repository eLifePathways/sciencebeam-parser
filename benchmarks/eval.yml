dataset:
  repo_id: elifepathways/sciencebeam-v2-benchmarking
  revision: main
  splits:
    train:
      biorxiv:
        file: biorxiv-jats/train-00000-of-00001.parquet
        id_column: ppr_id
    validation:
      biorxiv:
        file: biorxiv-jats/validation-00000-of-00001.parquet
        id_column: ppr_id

sampling:
  smoke:
    biorxiv: 10
  full:
    biorxiv: 158

seeds:
  sample: 42

fields:
  - title
  - abstract
  - author_full_names
  - affiliation_text
  - keywords
  - body_section_titles
  - acknowledgement
  - first_reference_text
  - reference_title
  - reference_doi

scoring:
  # Scoring types:
  #   string       - joins all list items with '' then compares as a single string
  #                  (appropriate for fields that are a single value in practice)
  #   ulist        - optimal item pairing regardless of order; requires equal list length
  #                  (appropriate for unordered multi-value fields, e.g. author names)
  #   partial_ulist - ulist but pads the shorter list; tolerates length mismatch
  #                  (appropriate for unordered fields with variable counts)
  #   list         - item-by-item comparison at matching positions; requires equal length
  #                  (appropriate for ordered multi-value fields)
  #   partial_list - list but pads the shorter list; tolerates length mismatch
  #                  (appropriate for ordered fields where predicted count may differ)
  default_methods:
    - levenshtein
    - edit_sim
  default_type: string
  per_field:
    title:
      methods: [exact, levenshtein, edit_sim]
    abstract:
      methods: [levenshtein, edit_sim]
    author_full_names:
      type: partial_ulist
    affiliation_text:
      type: partial_ulist
    keywords:
      type: partial_ulist
    body_section_titles:
      type: partial_list
    reference_title:
      type: partial_list
    reference_doi:
      type: partial_ulist
