dataset:
  repo_id: elifepathways/sciencebeam-v2-benchmarking
  revision: main
  splits:
    train:
      ore:
        file: ore-jats/train-00000-of-00001.parquet
        id_column: id
      scielo_preprints-jats:
        file: scielo-preprints-jats/train-00000-of-00001.parquet
        id_column: id

# Corpora confirmed CC-BY 4.0.  Others are excluded until per-record licence
# data is available in the dataset.
cc_by_corpora:
  - ore
  - scielo_preprints-jats

# Train-split row counts at revision main (2026-09-09); `main` moves, so re-check
# after a rebuild:
#   ore: 37, scielo_preprints-jats: 84
sampling:
  smoke:
    ore: 10
    scielo_preprints-jats: 10
  small:
    ore: 25
    scielo_preprints-jats: 25
  medium:
    ore: 50
    scielo_preprints-jats: 50
  large:
    ore: 100
    scielo_preprints-jats: 100
  full:
    ore: null   # all records
    scielo_preprints-jats: null

seeds:
  sample: 42

# What each corpus and model is meant to be generated at.  A mode names a
# `sampling` entry; `none` says no data is wanted, and a model left out says the
# same thing less deliberately.  This is what `dev-regenerate-training-data`
# reads, and what the state of the corpus is compared against.
generate:
  ore:
    segmentation: smoke
    header: smoke
    reference-segmenter: medium
    citation: medium
    affiliation-address: none
  scielo_preprints-jats:
    segmentation: smoke
    header: smoke
    reference-segmenter: medium
    citation: medium
    affiliation-address: none
