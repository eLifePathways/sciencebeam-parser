# The baselines the predictions store holds, against each other. Names no run under
# test, so it needs no parser and no benchmark of its own -- point it at a checked-out
# sciencebeam-eval-predictions and it compares what CI compares.
#
# The last variant is the primary, so deltas are measured against sciencebeam-parser.
# `label` is optional: left out, a column is named for its tool, version and profile,
# which is what tells two profiles of one version apart. Set it where that runs long --
# it is the column heading and the chart's legend entry, so it wants to stay short.
# `default` says nothing where a tool has only one profile, so GROBID is named for the
# engine its version already states.
variants:
  - {label: grobid 0.9.1-crf, tool: grobid, version: 0.9.1-crf, profile: default}
  - {label: agentic rl-v5full-s20, tool: jats-agentic-annotation, version: qwen3.5-9b-rl-v5full-s20, profile: default}
  - {label: parser wapiti (sp+ore), tool: sciencebeam-parser, version: main, profile: wapiti_scielo_preprints_ore}
  - {label: parser delft (sp+ore), tool: sciencebeam-parser, version: main, profile: delft_scielo_preprints_ore}
  - {label: parser llm_references, tool: sciencebeam-parser, version: main, profile: llm_references}
  - {label: parser grobid_crf, tool: sciencebeam-parser, version: main, profile: grobid_crf}

rows:
  - {field: title, method: levenshtein, type: string}
  - {field: abstract, method: levenshtein, type: string}
  - {field: author_full_names, method: levenshtein, type: partial_ulist}
  - {field: reference_title, method: levenshtein, type: partial_list}
  - {field: first_reference_text, method: levenshtein, type: string}

charts:
  - row: {field: reference_title, method: levenshtein}
    title: Reference titles by corpus
  - row: {field: title, method: levenshtein}
    title: Document titles by corpus
  - {compute: cpu_seconds_per_doc}
  - {compute: latency_median}
