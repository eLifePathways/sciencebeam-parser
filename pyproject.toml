[project]
name = "sciencebeam-parser"
version = "0.0.0"
description = "ScienceBeam Parser, parse scientific documents."
readme = "doc/generated_python_library.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.124.0",
    "fsspec>=2022.1.0",
    "gcsfs>=2022.1.0",
    "lxml>=6.0.2",
    "pdf2image==1.16.0",
    "pyyaml>=6.0.3",
    "sciencebeam-judge>=0.0.26",
    "pdfalto==0.6.3"
]

[project.optional-dependencies]
# torch is declared here, rather than left to arrive through delft, so that
# [tool.uv.sources] binds it to the CPU index across the whole lock
cpu = [
  "torch>=2.11.0",
  "torchvision>=0.26.0"
]
delft = [
    "sciencebeam-trainer-delft[delft]>=1.0.3",
    # delft is declared here, rather than left to arrive through
    # sciencebeam-trainer-delft, for its floor: the Hugging Face Hub support
    # (`delft.utilities.hub_models`, `delft.utilities.weights`) arrived in 1.2.0,
    # and a published sciencebeam-trainer-delft still allows an older delft,
    # which fails on import.
    # Both floors here are what a consumer installing this project from PyPI
    # resolves against; in this repo the source below wins over the first one,
    # and the commit it resolves to is in uv.lock.
    "delft>=1.2.0",
]
cv = [
    "layoutparser==0.3.2",
]
# Tracing for the llm engine. Optional: without it, and without a collector
# endpoint, the engine emits nothing and behaves identically.
telemetry = [
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[dependency-groups]
benchmark = [
    "font-source-sans-pro>=0.0.1",
    "httpx>=0.28",
    "huggingface-hub>=0.30",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pyarrow>=18",
    "sciencebeam-judge>=0.0.26",
]
dev = [
    "flake8>=4.0.1",
    # what starlette's TestClient is built on when installed, which the API tests
    # annotate its responses with; it falls back to httpx, deprecated, otherwise
    "httpx2>=2.14.0",
    "mypy>=1.19.0",
    "pylint>=3.3.9",
    "pytest>=8.4.2",
    "pytest-watcher>=0.4.3",
    "types-pyyaml>=6.0.12.12",
    "types-setuptools==57.4.9",
]
ocr = [
    "tesserocr==2.5.2",
]


[tool.uv.sources]
# TEMPORARY, until sciencebeam-trainer-delft releases its Hub support.
# uv.lock holds the commit, so a build stays reproducible; to follow the
# branch, `uv lock --upgrade-package sciencebeam-trainer-delft`.
sciencebeam-trainer-delft = { git = "https://github.com/eLifePathways/sciencebeam-trainer-delft", branch = "feature/hub-models" }
torch = [{ index = "torch-cpu" }]
torchvision = [{ index = "torch-cpu" }]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["sciencebeam_parser*"]

[tool.setuptools.package-data]
"sciencebeam_parser" = [
  "py.typed",
  "resources/*.yml",
  "resources/default_config/*.yml",
  "resources/xslt/*.xsl"
]

[tool.mypy]
files = ["sciencebeam_parser", "tests", "benchmarks"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest-watcher]
now = true
clear = false
delay = 0.2
runner = ".venv/bin/python"
runner_args = ["-m", "pytest"]
