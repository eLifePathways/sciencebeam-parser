[project]
name = "sciencebeam-parser"
version = "0.0.0"
description = "ScienceBeam Parser, parse scientific documents."
readme = "doc/generated_python_library.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.124.0",
    "fsspec>=2022.1.0",
    "gcsfs>=2022.1.0",
    "lxml>=6.0.2",
    "pdf2image==1.16.0",
    "pyyaml>=6.0.3",
    "sciencebeam-judge>=0.0.26",
    "pdfalto==0.6.3"
]

[project.optional-dependencies]
# torch is declared here, rather than left to arrive through delft, so that
# [tool.uv.sources] binds it to the CPU index across the whole lock
cpu = [
  "torch>=2.11.0",
  "torchvision>=0.26.0"
]
delft = [
    "sciencebeam-trainer-delft[delft]>=1.0.3",
    # delft is declared here, rather than left to arrive through
    # sciencebeam-trainer-delft, so that [tool.uv.sources] below binds it to the
    # branch carrying the Hugging Face Hub support: a uv source is not honoured
    # for a transitive requirement, and is not carried in the metadata of the
    # dependency that declares it, so relying on the source in
    # sciencebeam-trainer-delft's own pyproject resolves delft from PyPI
    # instead -- which has neither `delft.utilities.hub_models` nor
    # `delft.utilities.weights`, and so fails on import.
    # Both floors here are what a consumer installing this project from PyPI
    # resolves against; in this repo the sources win over them, and the commit
    # each resolves to is in uv.lock.
    "delft>=1.1.0",
]
cv = [
    "layoutparser==0.3.2",
]
# Tracing for the llm engine. Optional: without it, and without a collector
# endpoint, the engine emits nothing and behaves identically.
telemetry = [
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[dependency-groups]
benchmark = [
    "httpx>=0.28",
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "pyarrow>=18",
    "sciencebeam-judge>=0.0.26",
]
dev = [
    "flake8>=4.0.1",
    "mypy>=1.19.0",
    "pylint>=3.3.9",
    "pytest>=8.4.2",
    "pytest-watcher>=0.4.3",
    "types-pyyaml>=6.0.12.12",
    "types-setuptools==57.4.9",
]
ocr = [
    "tesserocr==2.5.2",
]


[tool.uv.sources]
# TEMPORARY, both of them, and they travel together: the Hub support in
# sciencebeam-trainer-delft's branch is written against delft's dev branch.
# uv.lock holds the commit of each, so a build stays reproducible; to follow a
# branch, `uv lock --upgrade-package <name>`.
sciencebeam-trainer-delft = { git = "https://github.com/eLifePathways/sciencebeam-trainer-delft", branch = "feature/hub-models" }
delft = { git = "https://github.com/kermitt2/delft", branch = "dev" }
torch = [{ index = "torch-cpu" }]
torchvision = [{ index = "torch-cpu" }]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["sciencebeam_parser*"]

[tool.setuptools.package-data]
"sciencebeam_parser" = [
  "py.typed",
  "resources/*.yml",
  "resources/default_config/*.yml",
  "resources/xslt/*.xsl"
]

[tool.mypy]
files = ["sciencebeam_parser", "tests", "benchmarks"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest-watcher]
now = true
clear = false
delay = 0.2
runner = ".venv/bin/python"
runner_args = ["-m", "pytest"]
