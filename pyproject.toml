[project]
name = "sciencebeam-parser"
version = "0.0.0"
description = "ScienceBeam Parser, parse scientific documents."
readme = "doc/generated_python_library.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.124.0",
    "fsspec>=2022.1.0",
    "gcsfs>=2022.1.0",
    "lxml>=6.0.2",
    "pdf2image==1.16.0",
    "pyyaml>=6.0.3",
    "sciencebeam-judge>=0.0.26",
]

[project.optional-dependencies]
# torch is declared here, rather than left to arrive through delft, so that
# [tool.uv.sources] binds it to the CPU index across the whole lock
cpu = [
  "torch>=2.11.0",
  "torchvision>=0.26.0"
]
delft = [
    "sciencebeam-trainer-delft[delft]>=1.0.1",
]
cv = [
    "layoutparser==0.3.2",
]

[dependency-groups]
benchmark = [
    "httpx>=0.28",
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "pyarrow>=18",
    "sciencebeam-judge>=0.0.26",
]
dev = [
    "flake8>=4.0.1",
    "mypy>=1.19.0",
    "pylint>=3.3.9",
    "pytest>=8.4.2",
    "pytest-watcher>=0.4.3",
    "types-pyyaml>=6.0.12.12",
    "types-setuptools==57.4.9",
]
ocr = [
    "tesserocr==2.5.2",
]


[tool.uv.sources]
torch = [{ index = "torch-cpu" }]
torchvision = [{ index = "torch-cpu" }]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["sciencebeam_parser*"]

[tool.setuptools.package-data]
"sciencebeam_parser" = [
  "py.typed",
  "resources/default_config/*.yml",
  "resources/xslt/*.xsl"
]

[[tool.mypy.overrides]]
module = "sciencebeam_judge.*"
ignore_missing_imports = true

[tool.pytest-watcher]
now = true
clear = false
delay = 0.2
runner = ".venv/bin/python"
runner_args = ["-m", "pytest"]
