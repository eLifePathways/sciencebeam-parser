services:
  sciencebeam-parser:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${IMAGE_NAME}:${IMAGE_TAG}

  sciencebeam-parser-cv:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-cv
    image: ${IMAGE_NAME}:${IMAGE_TAG}-cv
    # What `make docker-end-to-end-cv` is for: without this the service is the
    # same run as the plain one, which is why it never caught the cv model
    # being unloadable.
    environment:
      - SCIENCEBEAM_PARSER__PROCESSORS__FULLTEXT__USE_CV_MODEL=true

  sciencebeam-parser-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: ${IMAGE_NAME}-dev:${IMAGE_TAG}

  wait-for-it:
    image: willwill/wait-for-it
