name: Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke (10 docs) or full (158 docs)'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, full]
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'benchmark:smoke') ||
      contains(github.event.pull_request.labels.*.name, 'benchmark:full')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: benchmark
    permissions:
      contents: read
      packages: read

    env:
      BENCHMARK_SPLIT: validation
      BENCHMARK_MODE: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'benchmark:full')
          && 'full' || inputs.mode || 'smoke'
        }}
      BENCHMARK_RUN: benchmarks/runs/${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Set image tag
        id: image_tag
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          TIMESTAMP=$(date --utc +%Y%m%d.%H%M)
          PR="${{ github.event.pull_request.number }}"
          if [ -n "$PR" ]; then
            echo "value=sciencebeam-parser:pr-${PR}-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          else
            echo "value=sciencebeam-parser:manual-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: uv sync --frozen --group benchmark

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build parser image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: ${{ steps.image_tag.outputs.value }}
          load: true
          cache-from: |
            type=registry,ref=ghcr.io/elifepathways/sciencebeam-parser_unstable:buildcache-builder
            type=registry,ref=ghcr.io/elifepathways/sciencebeam-parser_unstable:buildcache-runtime

      - name: Start sciencebeam-parser
        run: docker run -d --name sciencebeam-parser -p 8080:8070 ${{ steps.image_tag.outputs.value }}

      - name: Wait for parser
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/; then
              echo; echo "Parser up"; exit 0
            fi
            sleep 5
          done
          docker logs sciencebeam-parser >&2
          echo "Parser never became healthy" >&2; exit 1

      - name: Run predict
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run python -m benchmarks.predict \
            --config benchmarks/eval.yml \
            --mode ${{ env.BENCHMARK_MODE }} \
            --split ${{ env.BENCHMARK_SPLIT }} \
            --data benchmarks/data \
            --out ${{ env.BENCHMARK_RUN }} \
            --parser-url http://localhost:8080 \
            --parser-image "${{ steps.image_tag.outputs.value }}"

      - name: Run score
        run: |
          uv run python -m benchmarks.score \
            --config benchmarks/eval.yml \
            --run ${{ env.BENCHMARK_RUN }} \
            --data benchmarks/data

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-run-${{ github.sha }}
          path: |
            ${{ env.BENCHMARK_RUN }}/*.md
            ${{ env.BENCHMARK_RUN }}/*.json
            ${{ env.BENCHMARK_RUN }}/*.jsonl
          retention-days: 30
