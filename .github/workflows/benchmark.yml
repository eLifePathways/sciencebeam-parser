name: Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke (10), small (25), medium (50), large (100), or full (all) docs per corpus'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, small, medium, large, full]
      profile:
        description: 'Model configuration profile (empty = image default)'
        required: false
        default: ''
        type: string
      include_plos:
        description: 'Also run the private PLOS corpus (not redistributable)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'benchmark:smoke') ||
      contains(github.event.pull_request.labels.*.name, 'benchmark:small') ||
      contains(github.event.pull_request.labels.*.name, 'benchmark:medium') ||
      contains(github.event.pull_request.labels.*.name, 'benchmark:large') ||
      contains(github.event.pull_request.labels.*.name, 'benchmark:full') ||
      contains(github.event.pull_request.labels.*.name, 'benchmark:plos')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: benchmark
    permissions:
      contents: read
      packages: read
      pull-requests: write

    env:
      BENCHMARK_SPLIT: validation
      BENCHMARK_MODE: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'benchmark:full') && 'full' ||
          contains(github.event.pull_request.labels.*.name, 'benchmark:large') && 'large' ||
          contains(github.event.pull_request.labels.*.name, 'benchmark:medium') && 'medium' ||
          contains(github.event.pull_request.labels.*.name, 'benchmark:small') && 'small' ||
          inputs.mode ||
          github.ref == 'refs/heads/main' && 'medium' ||
          'smoke'
        }}
      BENCHMARK_PROFILE: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'profile:grobid_crf') && 'grobid_crf' ||
          contains(github.event.pull_request.labels.*.name, 'profile:biorxiv_elife') && 'biorxiv_elife' ||
          inputs.profile ||
          'grobid_crf'
        }}
      # The PLOS corpus is private and its manuscripts are not redistributable, so a
      # run includes it only when a person asks for it by label.
      BENCHMARK_CORPORA: >-
        ${{
          (contains(github.event.pull_request.labels.*.name, 'benchmark:plos') ||
           inputs.include_plos) && '--include-corpus plos' || ''
        }}
      BENCHMARK_RUN: benchmarks/runs/${{ github.sha }}/validation

    steps:
      - uses: actions/checkout@v5

      - name: Set image tag
        id: image_tag
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          TIMESTAMP=$(date --utc +%Y%m%d.%H%M)
          PR="${{ github.event.pull_request.number }}"
          if [ -n "$PR" ]; then
            echo "value=sciencebeam-parser:pr-${PR}-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "value=sciencebeam-parser:main-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          else
            echo "value=sciencebeam-parser:manual-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: uv sync --frozen --group benchmark

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build parser image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: ${{ steps.image_tag.outputs.value }}
          load: true
          cache-from: |
            type=registry,ref=ghcr.io/elifepathways/sciencebeam-parser_unstable:buildcache-builder
            type=registry,ref=ghcr.io/elifepathways/sciencebeam-parser_unstable:buildcache-runtime

      - name: Checkout predictions repo
        uses: actions/checkout@v5
        with:
          repository: elifepathways/sciencebeam-eval-predictions
          path: sciencebeam-eval-predictions
          token: ${{ secrets.PREDICTIONS_REPO_PAT }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .gitignore
          sparse-checkout-cone-mode: false

      - name: Run baseline predictions
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run python -m benchmarks.run \
            --config benchmarks/eval.yml \
            --mode ${{ env.BENCHMARK_MODE }} \
            --split ${{ env.BENCHMARK_SPLIT }} \
            --data benchmarks/data \
            --runs benchmarks/runs/${{ github.sha }} \
            --predictions-repo sciencebeam-eval-predictions \
            ${{ env.BENCHMARK_CORPORA }} \
            --baseline-only

      - name: Start sciencebeam-parser
        run: |
          PROFILE_ENV=()
          if [ -n "${{ env.BENCHMARK_PROFILE }}" ]; then
            PROFILE_ENV=(-e "SCIENCEBEAM_PARSER__PROFILE=${{ env.BENCHMARK_PROFILE }}")
          fi
          docker run -d --name sciencebeam-parser -p 8080:8070 \
            -e SCIENCEBEAM_PARSER__PRELOAD_ON_STARTUP=true \
            "${PROFILE_ENV[@]}" ${{ steps.image_tag.outputs.value }}

      - name: Wait for parser
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/; then
              echo; echo "Parser up"; exit 0
            fi
            sleep 5
          done
          docker logs sciencebeam-parser >&2
          echo "Parser never became healthy" >&2; exit 1

      - name: Run benchmark
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          PUSH_CURRENT_ARG=()
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PUSH_CURRENT_ARG=(--push-current)
          fi
          uv run python -m benchmarks.run \
            --config benchmarks/eval.yml \
            --mode ${{ env.BENCHMARK_MODE }} \
            --split ${{ env.BENCHMARK_SPLIT }} \
            --data benchmarks/data \
            --runs benchmarks/runs/${{ github.sha }} \
            --predictions-repo sciencebeam-eval-predictions \
            --parser-url http://localhost:8080 \
            --parser-image "${{ steps.image_tag.outputs.value }}" \
            --profile "${{ env.BENCHMARK_PROFILE }}" \
            ${{ env.BENCHMARK_CORPORA }} \
            "${PUSH_CURRENT_ARG[@]}"

      - name: Write job summary
        run: |
          REPORT=${{ env.BENCHMARK_RUN }}/report.md
          if [ -f ${{ env.BENCHMARK_RUN }}/comparison.md ]; then
            REPORT=${{ env.BENCHMARK_RUN }}/comparison.md
          fi
          cat "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=${{ env.BENCHMARK_RUN }}/report.md
          if [ -f ${{ env.BENCHMARK_RUN }}/comparison.md ]; then
            REPORT=${{ env.BENCHMARK_RUN }}/comparison.md
          fi
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '[.[] | select(.body | startswith("## ScienceBeam Parser Evaluation"))] | .[0].id // empty')
          if [ -n "$COMMENT_ID" ]; then
            gh api repos/${{ github.repository }}/issues/comments/${COMMENT_ID} \
              -X PATCH -f body="$(cat ${REPORT})"
          else
            gh pr comment ${{ github.event.pull_request.number }} \
              --body-file "${REPORT}"
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-run-${{ github.sha }}
          path: |
            ${{ env.BENCHMARK_RUN }}/*.md
            ${{ env.BENCHMARK_RUN }}/*.json
            ${{ env.BENCHMARK_RUN }}/*.jsonl
          retention-days: 30
