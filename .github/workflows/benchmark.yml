name: Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke (10), small (25), medium (50), large (100), or full (all) docs per corpus'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, small, medium, large, full]
      profile:
        description: 'Model configuration profile (empty = image default)'
        required: false
        default: ''
        type: string
      include_plos:
        description: 'Also run the private PLOS corpus (not redistributable; already on for a push to main; refused for an llm profile)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]

# Only a size label or `benchmark:plos` starts a PR run, so labels added
# together start one run, and a modifier such as `profile:` or an unrelated
# label leaves a run in progress alone. A PR run supersedes the PR's previous
# one before any job starts; every other run is a group of its own here.
concurrency:
  group: >-
    ${{
      github.event_name == 'pull_request' &&
      (github.event.action == 'synchronize' ||
       contains(fromJson('["benchmark:smoke","benchmark:small","benchmark:medium","benchmark:large","benchmark:full","benchmark:plos"]'), github.event.label.name)) &&
      format('benchmark-{0}', github.ref) ||
      format('benchmark-run-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  profiles:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
       contains(fromJson('["benchmark:smoke","benchmark:small","benchmark:medium","benchmark:large","benchmark:full","benchmark:plos"]'), github.event.label.name)) ||
      (github.event.action == 'synchronize' && (
        contains(github.event.pull_request.labels.*.name, 'benchmark:smoke') ||
        contains(github.event.pull_request.labels.*.name, 'benchmark:small') ||
        contains(github.event.pull_request.labels.*.name, 'benchmark:medium') ||
        contains(github.event.pull_request.labels.*.name, 'benchmark:large') ||
        contains(github.event.pull_request.labels.*.name, 'benchmark:full') ||
        contains(github.event.pull_request.labels.*.name, 'benchmark:plos')))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      profiles: ${{ steps.resolve.outputs.profiles }}
      required: ${{ steps.resolve.outputs.required }}
    steps:
      - name: Resolve benchmark profiles
        id: resolve
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
          IS_PUSH_TO_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # The first is required; a failure of any other is a warning.
          MAIN_PROFILES=(recommended grobid_crf grobid_crf_as_grobid)
          if [ "$IS_PUSH_TO_MAIN" = "true" ]; then
            PROFILES=("${MAIN_PROFILES[@]}")
            PROFILE_SOURCE="push to main"
          else
            LABEL_PROFILE=$(echo "$PR_LABELS_JSON" | jq -r '.[]? | select(startswith("profile:")) | sub("^profile:"; "")' | head -n1)
            PROFILES=("${LABEL_PROFILE:-${DISPATCH_PROFILE:-recommended}}")
            if [ -n "$LABEL_PROFILE" ]; then
              PROFILE_SOURCE="profile:$LABEL_PROFILE label"
            elif [ -n "$DISPATCH_PROFILE" ]; then
              PROFILE_SOURCE="workflow_dispatch input"
            else
              PROFILE_SOURCE="default"
            fi
          fi
          for PROFILE in "${PROFILES[@]}"; do
            if ! [[ "$PROFILE" =~ ^[A-Za-z0-9_]+$ ]]; then
              echo "::error::Invalid profile '$PROFILE' (from $PROFILE_SOURCE) - only letters, digits and underscores are allowed"
              exit 1
            fi
          done
          echo "::notice::Benchmark profiles: ${PROFILES[*]} (from $PROFILE_SOURCE)"
          echo "profiles=$(printf '%s\n' "${PROFILES[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "required=${PROFILES[0]}" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: profiles
    name: benchmark (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.profiles.outputs.profiles) }}
    # Per profile, because two profiles write different paths in the predictions
    # store and so can run at once; not the mode or the corpus set, because those
    # share a path with every other run of the same profile and a concurrent push
    # to one path cannot be rebased.
    concurrency:
      group: benchmark-${{ github.ref }}-${{ matrix.profile }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: benchmark
    permissions:
      contents: read
      packages: read
      pull-requests: write
      statuses: write

    env:
      BENCHMARK_PROFILE: ${{ matrix.profile }}
      # The commit a PR shows the `Benchmark result` status on: the PR's head, or
      # the branch's head for a manual run, which is the PR's while it is current.
      BENCHMARK_STATUS_SHA: >-
        ${{
          github.event_name == 'pull_request' && github.event.pull_request.head.sha ||
          github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.sha ||
          ''
        }}
      BENCHMARK_FAILURE_IS_WARNING: ${{ matrix.profile != needs.profiles.outputs.required }}
      BENCHMARK_SPLIT: validation
      # A document the parser fails on writes no prediction, and scoring
      # iterates prediction files, so it leaves the denominator rather than
      # scoring zero. The failing set moves between runs, so a second pass
      # over what is still missing recovers most of it.
      BENCHMARK_RETRY_PASSES: 2
      BENCHMARK_MODE: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'benchmark:full') && 'full' ||
          contains(github.event.pull_request.labels.*.name, 'benchmark:large') && 'large' ||
          contains(github.event.pull_request.labels.*.name, 'benchmark:medium') && 'medium' ||
          contains(github.event.pull_request.labels.*.name, 'benchmark:small') && 'small' ||
          inputs.mode ||
          github.ref == 'refs/heads/main' && 'medium' ||
          'smoke'
        }}
      # Automatic on main, where the numbers that get recorded are produced and where
      # the baseline other runs compare against is pushed: without it that baseline
      # has no PLOS predictions, so a labelled PR can compare PLOS against GROBID but
      # never against main. Opt-in everywhere else -- the manuscripts are private and
      # not redistributable, so a PR or a laptop reaches for them only when asked.
      # A push, not a dispatch: a dispatch on main stores main under the profile it
      # names, which for an llm profile the run refuses to send PLOS to.
      BENCHMARK_CORPORA: >-
        ${{
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           contains(github.event.pull_request.labels.*.name, 'benchmark:plos') ||
           inputs.include_plos) && '--include-corpus plos-manuscripts' || ''
        }}
      BENCHMARK_RUN: benchmarks/runs/${{ github.sha }}/validation
      # Only the run under test: every other column stays on what the store holds.
      BENCHMARK_PREDICTION_FORMAT: >-
        ${{ contains(github.event.pull_request.labels.*.name, 'benchmark:jats') && 'jats' || 'tei' }}

    steps:
      - uses: actions/checkout@v5

      - name: Name the profile in the job summary
        run: echo "## Profile \`${BENCHMARK_PROFILE}\`" >> $GITHUB_STEP_SUMMARY

      # A PR's checks list shows only the newest run of a workflow, which is
      # usually a skipped one from another label, and no manual run at all; a
      # status stays visible.
      - name: Show the run on the PR
        if: env.BENCHMARK_STATUS_SHA != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${BENCHMARK_STATUS_SHA}" \
            -f state=pending -f context="Benchmark result" \
            -f description="${BENCHMARK_PROFILE}, ${BENCHMARK_MODE}: running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # For an interim model: a PR points a profile at gs://, gets benchmarked, and
      # either gains a public path or never merges. Nothing shipped reaches a bucket,
      # which tests/models/llm/shipped_config_test.py asserts, so most runs skip this.
      - name: Write GCS model reader key
        id: gcp_auth
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        env:
          GCS_MODEL_READER_SA_KEY_B64: ${{ secrets.GCS_MODEL_READER_SA_KEY_B64 }}
        run: |
          CONFIG=sciencebeam_parser/resources/default_config/config.yml
          if ! grep -q 'gs://' "$CONFIG"; then
            echo "No gs:// model path in $CONFIG - no credential needed"
            exit 0
          fi
          if [ -z "$GCS_MODEL_READER_SA_KEY_B64" ]; then
            echo "::error::$CONFIG has a gs:// model path, but the secret" \
              "GCS_MODEL_READER_SA_KEY_B64 is unset - unavailable to a fork PR"
            exit 1
          fi
          KEY_PATH="${RUNNER_TEMP}/gcs-model-reader-key.json"
          if ! printf '%s' "$GCS_MODEL_READER_SA_KEY_B64" | base64 -d > "$KEY_PATH"; then
            echo "::error::GCS_MODEL_READER_SA_KEY_B64 is not valid base64"
            exit 1
          fi
          if ! jq -e . "$KEY_PATH" > /dev/null 2>&1; then
            echo "::error::GCS_MODEL_READER_SA_KEY_B64 does not decode to JSON - truncated?"
            exit 1
          fi
          chmod 600 "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: image_tag
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          TIMESTAMP=$(date --utc +%Y%m%d.%H%M)
          PR="${{ github.event.pull_request.number }}"
          if [ -n "$PR" ]; then
            echo "value=sciencebeam-parser:pr-${PR}-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          # By branch rather than event: a dispatch on main is stored as main too, and
          # its tag is what names that column in every report that reads it.
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "value=sciencebeam-parser:main-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          else
            echo "value=sciencebeam-parser:manual-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          fi

      - uses: astral-sh/setup-uv@v5
        id: setup_uv
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        with:
          python-version: '3.11'

      - name: Install Python deps
        id: install_deps
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        run: uv sync --frozen --group benchmark

      - name: Login to GHCR
        id: ghcr_login
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build parser image
        id: build_image
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: ${{ steps.image_tag.outputs.value }}
          load: true
          cache-from: |
            type=registry,ref=ghcr.io/elifepathways/sciencebeam-parser_unstable:buildcache-builder
            type=registry,ref=ghcr.io/elifepathways/sciencebeam-parser_unstable:buildcache-runtime

      - name: Checkout predictions repo
        id: checkout_predictions
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: elifepathways/sciencebeam-eval-predictions
          path: sciencebeam-eval-predictions
          token: ${{ secrets.PREDICTIONS_REPO_PAT }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .gitignore
          sparse-checkout-cone-mode: false

      # Encrypted, because a fork's PR may restore what `main` saved, and a fork's
      # run is given no secrets. Saved from the medium sample, which every smaller
      # mode is a subset of. The eval.yml hash names the dataset versions; the PLOS
      # tag is pinned by name only. A digest of the passphrase starts a new entry
      # when it changes, since an entry under an existing key is never replaced.
      - name: Resolve the sample cache
        id: sample_cache
        env:
          SAMPLE_CACHE_PASSPHRASE: ${{ secrets.BENCHMARK_SAMPLE_CACHE_PASSPHRASE }}
        run: |
          if [ -n "$SAMPLE_CACHE_PASSPHRASE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BENCHMARK_SAMPLE_CACHE_PASSPHRASE is unset, so the sample is fetched from the Hub without a cache"
          fi
          PASSPHRASE_DIGEST=$(printf '%s' "$SAMPLE_CACHE_PASSPHRASE" | sha256sum | cut -c1-12)
          echo "key=benchmark-sample-${BENCHMARK_SPLIT}-medium-${{ hashFiles('benchmarks/eval.yml') }}-${PASSPHRASE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Restore the sample cache
        id: sample_cache_restore
        if: steps.sample_cache.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .benchmark-sample-cache/sample.tar.gpg
          key: ${{ steps.sample_cache.outputs.key }}

      - name: Unpack the sample cache
        if: steps.sample_cache_restore.outputs.cache-hit == 'true'
        env:
          SAMPLE_CACHE_PASSPHRASE: ${{ secrets.BENCHMARK_SAMPLE_CACHE_PASSPHRASE }}
        run: |
          ARCHIVE=.benchmark-sample-cache/sample.tar.gpg
          UNPACKED="${RUNNER_TEMP}/benchmark-sample"
          rm -rf "$UNPACKED" && mkdir -p "$UNPACKED"
          if gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --decrypt "$ARCHIVE" \
              3< <(printf '%s' "$SAMPLE_CACHE_PASSPHRASE") \
            | tar -x -C "$UNPACKED"; then
            mkdir -p benchmarks/data
            rm -rf "benchmarks/data/${BENCHMARK_SPLIT}"
            mv "${UNPACKED}/${BENCHMARK_SPLIT}" "benchmarks/data/${BENCHMARK_SPLIT}"
            echo "Restored $(find "benchmarks/data/${BENCHMARK_SPLIT}" -name '*.pdf' | wc -l) PDF(s) and" \
              "$(find "benchmarks/data/${BENCHMARK_SPLIT}" -name '*.jats.xml' | wc -l) gold file(s) from the cache"
          else
            echo "::warning::The sample cache did not decrypt or unpack, so the sample is fetched from the Hub"
          fi
          rm -rf "$UNPACKED" "$ARCHIVE"

      - name: Run baseline predictions
        id: baseline_predictions
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run python -m benchmarks.run \
            --config benchmarks/eval.yml \
            --mode ${{ env.BENCHMARK_MODE }} \
            --split ${{ env.BENCHMARK_SPLIT }} \
            --data benchmarks/data \
            --runs benchmarks/runs/${{ github.sha }} \
            --predictions-repo sciencebeam-eval-predictions \
            ${{ env.BENCHMARK_CORPORA }} \
            --baseline-only

      - name: Start sciencebeam-parser
        id: start_parser
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        env:
          # An llm profile reads this; every other profile ignores it. Passed as a
          # bare `-e NAME` so the value never appears in a command line, and so an
          # unset secret leaves it unset in the container rather than empty.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROFILE_ENV=()
          if [ -n "${{ env.BENCHMARK_PROFILE }}" ]; then
            PROFILE_ENV=(-e "SCIENCEBEAM_PARSER__PROFILE=${{ env.BENCHMARK_PROFILE }}")
          fi
          GCP_ENV=()
          if [ -n "${{ steps.gcp_auth.outputs.key_path }}" ]; then
            GCP_ENV=(
              -v "${{ steps.gcp_auth.outputs.key_path }}:/creds/gcp-key.json:ro"
              -e GOOGLE_APPLICATION_CREDENTIALS=/creds/gcp-key.json
            )
          fi
          docker run -d --name sciencebeam-parser -p 8080:8070 \
            -e SCIENCEBEAM_PARSER__PRELOAD_ON_STARTUP=true \
            -e OPENROUTER_API_KEY \
            "${GCP_ENV[@]}" "${PROFILE_ENV[@]}" ${{ steps.image_tag.outputs.value }}

      - name: Wait for parser
        id: wait_for_parser
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/; then
              echo; echo "Parser up"; exit 0
            fi
            sleep 5
          done
          docker logs sciencebeam-parser >&2
          echo "Parser never became healthy" >&2
          echo "For an llm profile, PRELOAD_ON_STARTUP validates the endpoint and" >&2
          echo "model id at startup, so a missing OPENROUTER_API_KEY fails here." >&2
          exit 1

      - name: Run benchmark
        id: run_benchmark
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          PUSH_CURRENT_ARG=()
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PUSH_CURRENT_ARG=(--push-current)
          fi
          uv run python -m benchmarks.run \
            --config benchmarks/eval.yml \
            --mode ${{ env.BENCHMARK_MODE }} \
            --split ${{ env.BENCHMARK_SPLIT }} \
            --data benchmarks/data \
            --runs benchmarks/runs/${{ github.sha }} \
            --predictions-repo sciencebeam-eval-predictions \
            --parser-url http://localhost:8080 \
            --parser-image "${{ steps.image_tag.outputs.value }}" \
            --profile "${{ env.BENCHMARK_PROFILE }}" \
            --prediction-format ${{ env.BENCHMARK_PREDICTION_FORMAT }} \
            --retry-passes ${{ env.BENCHMARK_RETRY_PASSES }} \
            --report-location "in the [job summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            ${{ env.BENCHMARK_CORPORA }} \
            "${PUSH_CURRENT_ARG[@]}"

      # Only from `main`, so branches do not each hold a copy, and only after a
      # complete fetch: an entry saved under this key is never topped up.
      - name: Pack the sample cache
        id: sample_cache_pack
        if: >-
          steps.sample_cache.outputs.enabled == 'true' &&
          steps.sample_cache_restore.outputs.cache-hit != 'true' &&
          steps.run_benchmark.outcome == 'success' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          env.BENCHMARK_FAILURE_IS_WARNING != 'true' &&
          env.BENCHMARK_MODE == 'medium'
        env:
          SAMPLE_CACHE_PASSPHRASE: ${{ secrets.BENCHMARK_SAMPLE_CACHE_PASSPHRASE }}
        run: |
          ARCHIVE=.benchmark-sample-cache/sample.tar.gpg
          mkdir -p "$(dirname "$ARCHIVE")"
          if tar -c -C benchmarks/data "$BENCHMARK_SPLIT" \
            | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 --compress-algo none -o "$ARCHIVE" \
                3< <(printf '%s' "$SAMPLE_CACHE_PASSPHRASE"); then
            echo "packed=true" >> "$GITHUB_OUTPUT"
            echo "Packed $(du -h "$ARCHIVE" | cut -f1) for the sample cache"
          else
            echo "::warning::The sample could not be packed for the cache"
            rm -f "$ARCHIVE"
          fi

      - name: Save the sample cache
        if: steps.sample_cache_pack.outputs.packed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .benchmark-sample-cache/sample.tar.gpg
          key: ${{ steps.sample_cache.outputs.key }}

      # The client only sees {"detail":"Internal Server Error"}, so without this a
      # 500 during the run is undiagnosable once the runner is gone. Bounded to
      # the tail because the log runs about 1.5 MB per 60 documents; upload-artifact
      # zips what it is given, so compressing here would only nest an archive.
      - name: Parser log
        if: always()
        run: |
          docker logs --tail 20000 sciencebeam-parser > parser.log 2>&1 || true
          echo "### Parser errors" >> $GITHUB_STEP_SUMMARY
          if grep -qE 'ERROR|Traceback' parser.log; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E 'ERROR|Traceback' -A 12 parser.log | tail -c 8000 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo 'none' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload parser log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: parser-log-${{ github.sha }}-${{ matrix.profile }}
          path: parser.log
          retention-days: 30

      - name: Write job summary
        id: job_summary
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        run: |
          REPORT=${{ env.BENCHMARK_RUN }}/report.md
          if [ -f ${{ env.BENCHMARK_RUN }}/comparison.md ]; then
            REPORT=${{ env.BENCHMARK_RUN }}/comparison.md
          fi
          cat "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment
        id: pr_comment
        if: ${{ github.event_name == 'pull_request' && !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ env.BENCHMARK_FAILURE_IS_WARNING == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=${{ env.BENCHMARK_RUN }}/report.md
          if [ -f ${{ env.BENCHMARK_RUN }}/comparison.md ]; then
            REPORT=${{ env.BENCHMARK_RUN }}/comparison.md
          fi
          # The comment-sized report beside it: the same thing with whole corpus
          # sections left out where the full one would exceed what GitHub accepts.
          REPORT="${REPORT%.md}-comment.md"
          PR=${{ github.event.pull_request.number }}
          LABEL="${{ steps.image_tag.outputs.value }} (${{ env.BENCHMARK_MODE }}, ${{ env.BENCHMARK_SPLIT }})"

          # A new comment per run rather than an edit, because an edit sends no
          # notification -- a finished run looked like one that never triggered.
          # Older reports are collapsed rather than deleted, so a PR with several
          # runs stays readable and every run's numbers remain there to compare.
          #
          # The marker is what finds them again, and carries the label so a
          # collapsed summary can still say which run it was.
          gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- benchmark-report:"))
                      | select(.body | contains("<summary><b>Benchmark") | not) | .id' \
          | while read -r id; do
              gh api "repos/${{ github.repository }}/issues/comments/${id}" --jq .body > old.md
              OLD_LABEL=$(head -1 old.md | sed -e 's/^<!-- benchmark-report: //' -e 's/ -->$//')
              {
                head -1 old.md
                echo "<details>"
                echo "<summary><b>Benchmark</b> — ${OLD_LABEL}</summary>"
                echo ""
                tail -n +2 old.md
                echo ""
                echo "</details>"
              } > collapsed.md
              gh api "repos/${{ github.repository }}/issues/comments/${id}" \
                -X PATCH -f body="$(cat collapsed.md)"
            done

          {
            echo "<!-- benchmark-report: ${LABEL} -->"
            cat "${REPORT}"
          } > benchmark-comment.md
          gh pr comment "${PR}" --body-file benchmark-comment.md

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-run-${{ github.sha }}-${{ matrix.profile }}
          path: |
            ${{ env.BENCHMARK_RUN }}/*.md
            ${{ env.BENCHMARK_RUN }}/*.json
            ${{ env.BENCHMARK_RUN }}/*.jsonl
          retention-days: 30

      - name: Report a failure as a warning
        if: ${{ !cancelled() && env.BENCHMARK_FAILURE_IS_WARNING == 'true' && contains(steps.*.outcome, 'failure') }}
        env:
          STEPS_JSON: ${{ toJson(steps) }}
        run: |
          FAILED=$(echo "$STEPS_JSON" | jq -r '[to_entries[] | select(.value.outcome == "failure") | .key] | join(", ")')
          echo "::warning::Benchmark of profile ${BENCHMARK_PROFILE} failed at: ${FAILED}. Only a failure of the required profile fails the run."

      # Not on cancel: a run is cancelled by the one superseding it, which has
      # already set its own pending status.
      - name: Show the outcome on the PR
        if: ${{ !cancelled() && env.BENCHMARK_STATUS_SHA != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          REPORT_WHERE="a PR comment"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            REPORT_WHERE="the job summary"
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success DESCRIPTION="${BENCHMARK_PROFILE}, ${BENCHMARK_MODE}: done, report in ${REPORT_WHERE}"
          else
            STATE=failure DESCRIPTION="${BENCHMARK_PROFILE}, ${BENCHMARK_MODE}: failed"
          fi
          gh api "repos/${{ github.repository }}/statuses/${BENCHMARK_STATUS_SHA}" \
            -f state="$STATE" -f context="Benchmark result" \
            -f description="$DESCRIPTION" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
