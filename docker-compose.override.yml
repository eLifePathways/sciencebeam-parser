services:
  sciencebeam-parser:
    # Publish on the host so host-side tools (e.g. compare-model-data via
    # SCIENCEBEAM_PARSER_URL=http://localhost:8080) can reach the parser.
    ports:
      - "8080:8070"
    # Serve the API using the locally trained DeLFT header model.
    # Env overrides are applied after profile resolution, so this wins over the
    # active grobid_crf profile's Wapiti header model.
    environment:
      # Preload all models at startup (single-threaded) so concurrent benchmark
      # requests don't race to download/compile into the same cache and corrupt it.
      - SCIENCEBEAM_PARSER__PRELOAD_ON_STARTUP=true
      # Uncomment the two lines below to serve the locally trained DeLFT header
      # model; leave commented for the stock Wapiti header (baseline).
      # - SCIENCEBEAM_PARSER__MODELS__HEADER__PATH=/opt/sciencebeam_parser/benchmarks/data/trained_model/header/header-full-v1.tar.gz
      # - SCIENCEBEAM_PARSER__MODELS__HEADER__ENGINE=delft
    volumes:
      - ./benchmarks:/opt/sciencebeam_parser/benchmarks

  sciencebeam-parser-cv:
    ports:
      - "${SCIENCEBEAM_PARSER_PORT}:8070"
    volumes:
      - ./sciencebeam_parser:/opt/sciencebeam_parser/sciencebeam_parser

  sciencebeam-parser-dev:
    # Secrets (e.g. HF_TOKEN) live in .env.local (gitignored) so they are set
    # once and never committed. A shell `export HF_TOKEN=...` still overrides it.
    env_file:
      - path: .env.local
        required: false
    environment:
      - BENCH_LOCAL_PARQUET_DIR
    volumes:
      - ./benchmarks:/opt/sciencebeam_parser/benchmarks
      - huggingface-cache:/root/.cache/huggingface

  # Tracing for the llm engine, dev-only and opt-in: the profile keeps it out of
  # a plain `docker compose up`. 6006 serves both the UI and the OTLP collector.
  # A parser running in compose would point at http://phoenix:6006; one running on
  # the host at http://localhost:6006.
  phoenix:
    # Pinned: a dev tool whose version moves under you makes "it worked
    # yesterday" unanswerable, and the trace schema is what the spans are read
    # through. Tags also exist unprefixed (20.3.0) and as -nonroot / -debug.
    image: arizephoenix/phoenix:version-20.3.0
    profiles:
      - telemetry
    ports:
      - "6006:6006"
    environment:
      # Phoenix keeps traces in a sqlite db under its working dir; without a
      # volume they are lost on restart, which defeats comparing runs.
      - PHOENIX_WORKING_DIR=/mnt/phoenix
    volumes:
      - phoenix-data:/mnt/phoenix

volumes:
  huggingface-cache:
  phoenix-data:
