services:
  sciencebeam-parser:
    # Publish on the host so host-side tools (e.g. compare-model-data via
    # SCIENCEBEAM_PARSER_URL=http://localhost:8080) can reach the parser.
    ports:
      - "8080:8070"

  sciencebeam-parser-cv:
    ports:
      - "${SCIENCEBEAM_PARSER_PORT}:8070"
    volumes:
      - ./sciencebeam_parser:/opt/sciencebeam_parser/sciencebeam_parser

  sciencebeam-parser-dev:
    # Secrets (e.g. HF_TOKEN) live in .env.local (gitignored) so they are set
    # once and never committed. A shell `export HF_TOKEN=...` still overrides it.
    env_file:
      - path: .env.local
        required: false
    environment:
      - BENCH_LOCAL_PARQUET_DIR
    volumes:
      - ./benchmarks:/opt/sciencebeam_parser/benchmarks
      - huggingface-cache:/root/.cache/huggingface

volumes:
  huggingface-cache:
