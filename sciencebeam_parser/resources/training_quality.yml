# What the quality gate requires of a generated document before its training
# data is used, per model.
#
# The counts come from the quality record: the references the JATS declares, the
# elements generation wrote, and the entities those elements parse back to.  Each
# threshold is a floor on one stage against the one before it, so a document that
# fails names the stage that lost its references rather than only that it is wrong.
#
#   min_jats_reference_count  a document whose JATS declares fewer references than
#                             this has no reference of record; no comparison
#                             between stages can flag it, because every stage
#                             agrees on zero
#   min_element_ratio         elements written, over the references the JATS
#                             declares.  An exact match is too strict: what a
#                             PDF's reference list contains and what the JATS
#                             carries legitimately differ
#   min_entity_ratio          entities the training data ends up with, over the
#                             elements the TEI holds.  This is the stage where two
#                             sibling elements sharing a label used to come back as
#                             one entity, and the floor is what keeps that from
#                             returning unnoticed
#
# Over-counting is recorded and not failed.  The reference segmenter writes a
# block per contiguous run of a reference's lines, so a reference split across a
# column or a page becomes two elements -- 7 of 50 scielo_preprints-jats documents,
# where the citation model's count of the same references matches the JATS exactly.
# Those documents are otherwise sound, and the split is a defect of alignment
# rather than of the data's cardinality.
#
# A model with no cardinality to check carries `cardinality: none` and a reason,
# rather than being left out: a missing entry is a decision not taken, and the
# gate says so instead of passing silently.

corpus:
  # Beyond this share of a corpus excluded, assembly refuses rather than
  # proceeds.  Dropping most of a corpus is a finding about the pipeline, not a
  # routine filter outcome, and the counterpart of failing on inconsistent
  # feature lengths on the training side.  Raise it deliberately, with the
  # reason recorded, rather than working around the refusal.
  max_excluded_ratio: 0.2

  # The same refusal for a corpus most of which nobody has read, against its own
  # threshold.  A document excluded for not being reviewed says the review has
  # not caught up with the data; one excluded for failing a measurement says the
  # pipeline lost it.  Counting both against `max_excluded_ratio` would make
  # whoever first meets a merely unread corpus raise it, which costs the
  # pipeline-breakage signal that threshold exists for.  This is lower, because
  # a corpus a model trains on only once it is read is not read at nine tenths.
  #
  # It catches the systemic case rather than judging any document: a pin recipe
  # that changes lapses every verdict at once, and a corpus demanding acceptance
  # would then quietly assemble almost nothing.
  max_unreviewed_ratio: 0.1

  # There is deliberately no threshold on the share a reader refused.  Both of
  # the above exist because their cause can be silent -- a measurement is
  # inferred from proxies that misfire together, and a lapse can take a whole
  # corpus at once -- and a ratio is how a silent fault announces itself.  A
  # rejection is neither: somebody read the document and said no, and the
  # decision is recorded against that document.  Refusing over it would decline
  # the data a reader approved because other data was not, and would refuse more
  # readily the more carefully a corpus had been read.  The share is reported
  # with every assembly, because how much of a corpus a reader refuses is worth
  # knowing; it is a finding about generation rather than a reason to stop.

# What each corpus demands of a document before its data is used -- accepted,
# not rejected, or measured only -- is declared with the data, in the corpus's
# own `training-source.yml`, per corpus and model.  How much of a corpus has
# been read is a fact about that corpus rather than about the model, and the
# verdicts it is about are committed there.  What this file states is what the
# gate can measure and where its floors sit, which is a property of the model
# and the pipeline.

models:
  reference-segmenter:
    min_jats_reference_count: 1
    min_element_ratio: 0.9
    min_entity_ratio: 0.8

  citation:
    min_jats_reference_count: 1
    min_element_ratio: 0.9
    # Every element is its own training sequence, so there is no entity ratio to
    # take; what can change is which labels are marked, and that is recorded per
    # label rather than gated.  No floor is set because the level of a label's
    # rate says as much about the publisher as the pipeline: title, journal,
    # date, volume, pages and author sit at 0.95 and above on both measured
    # corpora, while ORE prints no DOI at all where its JATS carries one for
    # 1205 of 1679 references, so a floor on the identifier would reject nearly
    # every one of its documents.  A rate that moves is the finding.
    label_floors: {}

  segmentation:
    cardinality: none
    reason: >
      labels mark regions of a document, which occur once rather than repeatedly.
      The record carries lines per region instead, and how many of them a JATS
      field grounded: `<body>` is the aligner's sink, so an ungrounded `<body>`
      line is one the JATS had no opinion about rather than one it called body.
    # A tripwire rather than a filter.  Our own corpora pair at 1.000 on every
    # one of their 86 documents, and the worst of GROBID's 925 is 0.811
    # (`0951-7715_24_7_004`), with nothing below 0.80 and ten below 0.90.  So
    # this refuses nothing that is read today, and a pairing that broke would
    # have to break badly to trip it.  It sits low on purpose: refusing a
    # document GROBID keeps would diverge from the published file the
    # reconstruction is measured against, and the share of a corpus that is
    # merely imperfectly annotated is a finding rather than a reason to stop.
    min_matched_row_ratio: 0.75

    # No floor on the sink share yet.  It is high enough on the measured corpora
    # that a floor near its level risks refusing most of a corpus through
    # `max_excluded_ratio`, and one well above it may exclude nothing at all;
    # which is true is readable from the record once a full corpus has one, and
    # is not worth guessing before then.
    label_floors: {}
  header:
    cardinality: none
    reason: labels mark fields of one header, so presence is what matters
  affiliation-address:
    cardinality: none
    reason: >
      one entity per affiliation, but the JATS count is of affiliations rather than
      references and has no measured threshold yet
  name-header:
    cardinality: none
    reason: one entity per author name, with no measured threshold yet
  name-citation:
    cardinality: none
    reason: one entity per author name, with no measured threshold yet
  fulltext:
    cardinality: none
    reason: labels mark body regions, which occur once each
  figure:
    cardinality: none
    reason: one entity per figure, with no measured threshold yet
  table:
    cardinality: none
    reason: one entity per table, with no measured threshold yet
