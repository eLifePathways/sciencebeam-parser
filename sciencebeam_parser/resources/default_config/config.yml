    extends: delft_hub
    label: 'GROBID deep learning'
    description: 'The deep-learning models GROBID publishes to the Hugging Face Hub, where it publishes one.'
  recommended:
    extends: delft_all_scielo_preprints_ore
    label: 'Recommended'
    description: 'The combination we currently recommend. Its models change between releases, and the profile digest on each response identifies them.'
  recommended_cv:
    extends: delft_all_scielo_preprints_ore_cv
    label: 'Recommended, with computer vision'
    description: 'The recommended combination, locating figures and tables on the rendered page. Slower.'
  lightweight:
    extends: wapiti_all_scielo_preprints_ore
    label: 'Lightweight'
    description: 'Retrained CRF models throughout, for a deployment that will not run deep-learning models.'

profile_aliases: {}

profile: recommended

# Which profiles a request may name with `?profile=`, beside `profile` above,
# which is always selectable and is what a request naming nothing gets. Empty by
# default: a process holds only what it was started for until a deployment says
# it may hold more. `all` means every profile declared above, still bounded by
# `max_loaded_models`.
selectable_profiles:
  - recommended
  - recommended_cv
  - lightweight
  - grobid_crf
  - grobid_dl

# How many distinct sequence models one process will hold across every profile
# it has served. Counted in models rather than profiles because profiles overlap:
# the wapiti ones differ from their base by one model of ten. Over this, a
# request for a profile not already resolved is refused rather than loaded.
max_loaded_models: 40

# Render workers alive at once, across every profile. Each holds a document
# open for as long as it serves one. Over this, a request waits.
max_render_workers: 2

# Seconds to wait for a free render worker, and for one to answer a request.
render_timeout: 120

# 0 or blank for no limit
max_upload_bytes: 67108864

# Which origins a browser page may call the API from, matched exactly, or `*`
# for every origin. Empty permits none. See doc/cors.md.
cors:
  allowed_origins: []

cv_models:
  default:
    path: 'docling-project/docling-layout-heron'
    engine: 'transformers'
    score_threshold: 0.5
    # A share of the page area, so it holds at any `cv_render_dpi`.
    min_area_ratio: 0.01
    # The checkpoint's own labels; an unmapped one is dropped.
    type_name_by_label:
      picture: 'Figure'
      table: 'Table'

ocr_models:
  default:
    engine: 'tesserocr'
    lang: 'eng'
    # see https://github.com/sirfz/tesserocr/blob/v2.5.2/tesserocr.pyx#L75-L90
    # (specify literal or int value)
    oem: 'DEFAULT'
    # see https://github.com/sirfz/tesserocr/blob/v2.5.2/tesserocr.pyx#L102-L121
    # (specify literal or int value)
    psm: 'SPARSE_TEXT'

doc_to_pdf:
  enabled: true
  listener:
    port: 2003
    process_timeout: 600
    max_uptime: 10
  convert:
    remove_line_no: true
    remove_header_footer: true
    remove_redline: true

output:
  pretty_print_xml: true

# preload resources and models on startup
preload_on_startup: false
