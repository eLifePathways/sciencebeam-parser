    citation:
      path: 'https://huggingface.co/elifepathways/sciencebeam-sequence-models/resolve/e266cc546e035e0d41734b9403b9cb496b6895a1/citation/wapiti/2026-09-08_wapiti_grobid_090_scielo_preprints_ore'
      engine: 'wapiti'
  wapiti_references_scielo_preprints_ore:
    extends:
      - wapiti_refseg_scielo_preprints_ore
      - wapiti_citation_scielo_preprints_ore
  # The same training documents as the wapiti pair above, on the delft engine.
  delft_refseg_scielo_preprints_ore:
    extends: grobid_crf_0_9_0
    reference_segmenter:
      path: 'https://huggingface.co/elifepathways/sciencebeam-sequence-models/resolve/dd39a9d6246b94a4e5861cf548921a7a3f1ba0ca/reference-segmenter/delft/2026-09-18_CustomBidLSTM_CRF_grobid_090_scielo_preprints_ore'
      engine: 'delft'
  delft_citation_scielo_preprints_ore:
    extends: grobid_crf_0_9_0
    citation:
      path: 'https://huggingface.co/elifepathways/sciencebeam-sequence-models/resolve/dd39a9d6246b94a4e5861cf548921a7a3f1ba0ca/citation/delft/2026-09-18_CustomBidLSTM_CRF_grobid_090_scielo_preprints_ore'
      engine: 'delft'
  delft_references_scielo_preprints_ore:
    extends:
      - delft_refseg_scielo_preprints_ore
      - delft_citation_scielo_preprints_ore
  # Segmentation, trained on the same documents. Both engines, so the pair can be
  # compared against each other as well as against the shipped wapiti model.
  wapiti_seg_scielo_preprints_ore:
    extends: grobid_crf_0_9_0
    segmentation:
      path: 'https://huggingface.co/elifepathways/sciencebeam-sequence-models/resolve/08e5e4a5e6080e6e1874ef6ab4dc8cca7ceac181/segmentation/wapiti/2026-10-06_wapiti_grobid_090_scielo_preprints_ore'
      engine: 'wapiti'
  delft_seg_scielo_preprints_ore:
    extends: grobid_crf_0_9_0
    segmentation:
      path: 'https://huggingface.co/elifepathways/sciencebeam-sequence-models/resolve/eb37314ac4f24d0147406eaef94279b6a35d8e44/segmentation/delft/2026-10-16_CustomBidLSTM_CRF_grobid_090_scielo_preprints_ore_b50_flex_line_text'
      engine: 'delft'
  delft_header_scielo_preprints_ore:
    extends: grobid_crf_0_9_0
    header:
      path: 'https://huggingface.co/elifepathways/sciencebeam-sequence-models/resolve/86795599d16fc238a7a7c233c55d289ced5270a7/header/delft/2026-11-06_CustomBidLSTM_CRF_grobid_090_scielo_preprints_ore_b30_flex'
      engine: 'delft'
    # GROBID's header name model retrained for coverage (grobidOrg/grobid#1641), then again
    # with Spanish and Portuguese names added (grobidOrg/grobid@3f3f463); the same model
    # file, published with its training record. It is run as GROBID runs it there: the
    # author list is featured as one line, since the model never saw a line break inside one.
    name_header:
      path: 'https://huggingface.co/elifepathways/sciencebeam-sequence-models/resolve/8ec54ceae6aeb0b5862984272644bdefb55dd4b9/name-header/wapiti/2026-11-10_wapiti_grobid_multilang'
      engine: 'wapiti'
      ignore_line_breaks: true
  # Every retrained model of an engine at once. The pair above it --
  # wapiti_references_scielo_preprints_ore and delft_references_scielo_preprints_ore -- stays the
  # reference models alone, so a change in the references can still be read
  # without segmentation moving underneath it.
  wapiti_all_scielo_preprints_ore:
    extends:
      - wapiti_seg_scielo_preprints_ore
      - wapiti_refseg_scielo_preprints_ore
      - wapiti_citation_scielo_preprints_ore
  delft_all_scielo_preprints_ore:
    extends:
      - delft_seg_scielo_preprints_ore
      - delft_header_scielo_preprints_ore
      - delft_refseg_scielo_preprints_ore
      - delft_citation_scielo_preprints_ore
  # Opt-in only: select with SCIENCEBEAM_PARSER__PROFILE, never by default.
  # Requires an api key in SCIENCEBEAM_LLM_API_KEY or OPENROUTER_API_KEY.
  # One profile per model so a failure can be attributed, plus a combined one.
  llm_reference_segmenter:
    extends: grobid_crf_0_9_0
    reference_segmenter:
      engine: 'llm'
      task: 'reference_segmenter'
      response_shape: 'lines'
      model: 'qwen/qwen3.5-9b'
      provider: 'venice'
      prompt_version: 'lines-v2'
      reasoning_enabled: false
  llm_citation:
    extends: grobid_crf_0_9_0
    citation:
      engine: 'llm'
      task: 'citation'
      response_shape: 'values'
      model: 'qwen/qwen3.5-9b'
      # Venice over SiliconFlow on measurement, not preference: 33 references in
      # 4 batches took 12s against 39s, at the same fp8 quantisation and price,
      # and 100% reported uptime against 96%. It costs about 0.007 token accuracy
      # (0.860 against 0.867), which is inside the run-to-run spread of most
      # things measured here, and latency has been the binding constraint.
      provider: 'venice'
      prompt_version: 'values-v3'
      reasoning_enabled: false
      # References of a document arrive in one call to the engine, which sends
      # them in batches. Decode cost is linear in output tokens however they are
      # grouped, so a larger batch does not generate less — it generates the same
      # amount in one long stream that cannot be overlapped, and long generations
      # are what draw provider timeouts. More, smaller batches run concurrently
      # instead: 4 calls took 111s sequentially and 58s at 4 concurrent, with the
      # same accuracy. Beyond 4 it stops helping on either provider measured, so
      # the bound is provider throughput rather than parallelism. Lower it if the
      # provider answers with 429s.
      max_references_per_request: 10
      max_concurrent_requests: 4
  llm_segmentation:
    extends: grobid_crf_0_9_0
    segmentation:
      engine: 'llm'
      task: 'segmentation'
      response_shape: 'regions'
      # Chosen by measurement over six models on the failure that separates this
      # from the CRF -- a bibliography the model has already delimited and then
      # labels `body`. glm is right on 10 of 10 where the previous 9b is right on
      # 8, and converts 60 benchmark documents of 60 with no rejected response.
      # No provider is pinned: routing still demands zero retention.
      model: 'z-ai/glm-4.7-flash'
      prompt_version: 'regions-v9'
      reasoning_enabled: false
      # A whole document rather than a region: median 743 lines and up to 1682 on
      # the measured corpus, so the references-sized guards would warn on every
      # document and say nothing.
      warn_input_lines: 2500
      max_input_lines: 4000
      # Bounds one request rather than the document, so a document longer than
      # the guard is split instead of refused. Measured over 60 train documents
      # against no windowing: 0.595 against 0.587 over ten fields, at the same
      # cost, splitting 27% of them. Individual documents move either way by up
      # to 0.15 -- a smaller input re-rolls labels that are unstable anyway --
      # and the mean does not move. 1500 keeps the largest request near 88k
      # tokens on the densest measured document, against a 200k context.
      window_lines: 1500
  llm_references:
    extends:
      - llm_reference_segmenter
      - llm_citation
  llm_all:
    extends:
      - llm_segmentation
      - llm_reference_segmenter
      - llm_citation
  # Models taken from the Hugging Face Hub, rather than from a release archive.
  # The delft engine resolves an `hf://owner/repository[@revision]/model` path
  # itself, downloading the model directory under `download_dir`/models; the
  # revision is optional and, left out, follows the branch, so a model can
  # change under a running deployment. Each is therefore pinned to a commit of
  # its own repository, the repositories carrying no tags: taking a newer model
  # means changing its sha here.
  # Only the models published to the Hub are overridden here, the rest coming
  # from the GROBID 0.9.0 wapiti models. Every override names `engine: delft`:
  # a profile is deep merged over the one it extends, so overriding only `path`
  # on a wapiti entry would keep `engine: wapiti` and hand a delft directory to
  # the wapiti loader. (`grobid_crf` is a profile alias, which `extends` does
  # not resolve.)
  # A model GROBID trained expects GROBID's features rather than the ones the
  # biorxiv models were trained on, which `feature_flavour: grobid` selects.
  # `weight_file` names the weights to load where a model directory holds more
  # than one: the header and affiliation-address directories carry the
  # retrained weights as `model.safetensors`, beside a `model_weights.pt` left
  # from the model before, which no longer matches their preprocessor.
  # The header is the glove variant: the character-only one runs titles on into
  # the next line ("Author list:", "Running Title ...") on English papers, which
  # word embeddings largely fix. It needs the glove-840B vectors, found as an LMDB
  # under data/db/glove-840B, else downloaded (1.8GB) and indexed on first load.
  delft_hub:
    extends: grobid_crf_0_9_0
    header:
      path: 'hf://sciencialab/grobid-model-header@dca8c2b5338300511dc254a73aae987c014e6cca/grobid-header-BidLSTM_CRF_FEATURES-no_embeddings'
      engine: 'delft'
      weight_file: 'model.safetensors'
      feature_flavour: 'grobid'
    affiliation_address:
      path: 'hf://sciencialab/grobid-model-affiliation-address@fcb11e276cfe6be53f84e028d066c295ecb57773/grobid-affiliation-address-BidLSTM_CRF_FEATURES-no_embeddings'
      engine: 'delft'
      weight_file: 'model.safetensors'
    citation:
      path: 'hf://sciencialab/grobid-model-citation@3db81cd58276cb3a446bbb274c610d1233b7ce8c/grobid-citation-BidLSTM_CRF_FEATURES-no_embeddings'
      engine: 'delft'
    reference_segmenter:
      path: 'hf://sciencialab/grobid-model-reference-segmenter@c9d959488a08324fa53d40013e9b02f85af4886d/grobid-reference-segmenter-BidLSTM_CRF_FEATURES-no_embeddings'
      engine: 'delft'
    name_header:
      path: 'hf://sciencialab/grobid-model-name-header@33d2b42a21cddc7439a2e058329e2dc48ecb1021/grobid-name-header-BidLSTM_CRF_FEATURES-no_embeddings'
      engine: 'delft'
    name_citation:
      path: 'hf://sciencialab/grobid-model-name-citation@1b7a20928f9572c5a7b3180a82fbc4370df6189b/grobid-name-citation-BidLSTM_CRF_FEATURES-no_embeddings'
      engine: 'delft'

profiles:
