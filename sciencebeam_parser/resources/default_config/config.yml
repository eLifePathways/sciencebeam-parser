logging:
  # Python logging config (passed to dictConfig)
  version: 1
  disable_existing_loggers: false
  formatters:
    default:
      format: '[%(asctime)s] %(levelname)s in %(name)s:%(lineno)s: %(message)s'
  handlers:
    console:
      level: INFO
      formatter: default
      class: logging.StreamHandler
      stream: ext://sys.stdout
    log_file:
      level: INFO
      formatter: default
      class: logging.handlers.RotatingFileHandler
      filename: 'logs/server.log'
      mode: 'a'
      maxBytes: 67108864  # 64 MB
      backupCount: 10
  loggers:
    # root logger
    '':
      level: INFO
      handlers:
        - console
        - log_file
    sciencebeam_parser:
      level: DEBUG
    __main__:
      level: DEBUG
    delft:
      level: INFO
    sciencebeam_trainer_delft:
      level: INFO
    uvicorn:
      level: INFO

# The download directory for ScienceBeam Parser resources.
# Not the cv model, which caches under HF_HOME.
download_dir: '~/.cache/sciencebeam-parser/downloads'

# Where the llm engine replays completions from, for every llm model at once.
# Unset is off, and it stays off outside development: the entries hold document
# text, and a deployment parses documents that are all different. Not a path
# under download_dir, which is public model artifacts with a different lifetime.
#   llm_response_cache_dir: data/llm-response-cache
llm_response_cache_dir:

pdfalto:
  # Defaults to the executable bundled with the `pdfalto` Python package
  # (platform-specific wheel). Override with a local path or a URL if needed, e.g.:
  # path: /usr/local/bin/pdfalto
  # path: https://github.com/kermitt2/pdfalto/releases/download/v0.6.0/pdfalto-bin-linux-64.zip!/pdfalto/linux/64/pdfalto
  # Setting the PDFALTO_BINARY environment variable also overrides the bundled executable.
  path:
wapiti:
  install_source: 'https://github.com/kermitt2/Wapiti/archive/a9c25d2bcccd60f1a54a7019689bd5229e866f00.tar.gz'
xslt:
  tei_to_jats:
    parameters:
      # parameters for tei-to-jats.xsl
      output_parameters: 'false'
      output_bold: 'false'
      output_italic: 'false'
      output_empty_figure_graphic: 'true'
      acknowledgement_target: 'ack'
      annex_target: 'back'
lookup:
  country:
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/countries/CountryCodes.xml
  first_name:
    # GROBID splits each name-file line on tab and hyphen, taking the first component.
    # e.g. "Mary-Ann" → "mary" only. Enable here to match that behaviour.
    split_on_hyphen: true
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/firstname.5k
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/names.female
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/names.male
  last_name:
    split_on_hyphen: true
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/lastname.5k
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/names.family
  common_name:
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/wordforms/english.wf
  location_name:
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/places/location.txt
processors:
  fulltext:
    # Which abstracts reach the output where the header model labels more than one
    # region as the abstract. `first` keeps the first and leaves the rest as notes.
    # `variants` emits the others as further abstracts too, each declaring the language
    # of its own text. `merged_by_language` joins those sharing a language into one.
    abstracts_mode: 'first'
    noise_filter:
      enabled: true
      repetition_fraction: 0.5
      position_consistency_fraction: 0.8
      max_position_stddev: 0.05
      max_height_ratio: 2.0
      preserve_first_page_head: false
      preserve_first_page_foot: false
      outside_main_area: false
      min_repeating_pattern_length: 3
      max_letterless_length: 12
      # Follows the segmentation engine, so it belongs in the profile wherever that
      # engine is not a CRF. `drop` takes the blocks out before segmentation, which
      # a CRF gains from and a model reading text does not; `relabel` leaves the
      # document whole and overrules the label it gives them, which is all an LLM
      # can use and costs a CRF the documents its features shift on.
      action: 'drop'
    merge_raw_authors: false
    use_cv_model: false
    cv_render_dpi: 100
    use_ocr_model: false
    replace_text_by_cv_graphic: false
    max_graphic_distance: 0.3
    # A graphic enclosing this much of a candidate's own text is its ruling, not its image.
    max_enclosed_text_ratio: 0.5
    # Ratios are shares of the page, so they hold at any page size.
    graphic_regions:
      enabled: true
      merge_gap_ratio: 0.02
      min_area_ratio: 0.01
      vector_cluster_gap_ratio: 0.02
      min_vector_path_count: 8
      min_vector_shape_path_count: 2
      max_vector_path_count: 10000
      min_vector_content_size: 10
      max_text_ratio_without_content: 0.2
      min_page_border_rule_ratio: 0.85
      # An asset is rendered from the page where text is drawn over the region.
      render_dpi: 150
      min_text_over_graphic_ratio: 0.5
