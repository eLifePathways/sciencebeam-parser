    citation:
      path: 'https://huggingface.co/elifepathways/sciencebeam-sequence-models/resolve/e266cc546e035e0d41734b9403b9cb496b6895a1/citation/wapiti/2026-08-04_wapiti_grobid_090_grobid_only'
      engine: 'wapiti'
  wapiti_refseg_scielo_preprints_ore:
    extends: grobid_crf_0_9_0
    reference_segmenter:
      path: 'https://huggingface.co/elifepathways/sciencebeam-sequence-models/resolve/e266cc546e035e0d41734b9403b9cb496b6895a1/reference-segmenter/wapiti/2026-09-08_wapiti_grobid_090_scielo_preprints_ore'
