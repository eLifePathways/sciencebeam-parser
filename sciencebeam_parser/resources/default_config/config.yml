logging:
  # Python logging config (passed to dictConfig)
  version: 1
  disable_existing_loggers: false
  formatters:
    default:
      format: '[%(asctime)s] %(levelname)s in %(name)s:%(lineno)s: %(message)s'
  handlers:
    console:
      level: INFO
      formatter: default
      class: logging.StreamHandler
      stream: ext://sys.stdout
    log_file:
      level: INFO
      formatter: default
      class: logging.handlers.RotatingFileHandler
      filename: 'logs/server.log'
      mode: 'a'
      maxBytes: 67108864  # 64 MB
      backupCount: 10
  loggers:
    # root logger
    '':
      level: INFO
      handlers:
        - console
        - log_file
    sciencebeam_parser:
      level: DEBUG
    __main__:
      level: DEBUG
    delft:
      level: INFO
    sciencebeam_trainer_delft:
      level: INFO
    uvicorn:
      level: INFO

# The download directory for ScienceBeam Parser resources
# Note: the CV model may download resources to `~/.torch/iopath_cache`,
#    unless FVCORE_CACHE is set. (See `iopath.common.file_io.get_cache_dir`)
download_dir: '~/.cache/sciencebeam-parser/downloads'

pdfalto:
  # path is auto-detected based on the current platform if not specified
  # (override with an explicit URL if needed, e.g.:)
  # path: https://github.com/kermitt2/pdfalto/releases/download/v0.6.0/pdfalto-bin-linux-64.zip!/pdfalto/linux/64/pdfalto
  path:
wapiti:
  install_source: 'https://github.com/kermitt2/Wapiti/archive/a9c25d2bcccd60f1a54a7019689bd5229e866f00.tar.gz'
xslt:
  tei_to_jats:
    parameters:
      # parameters for tei-to-jats.xsl
      output_parameters: 'false'
      output_bold: 'false'
      output_italic: 'false'
      output_empty_figure_graphic: 'true'
      acknowledgement_target: 'ack'
      annex_target: 'back'
lookup:
  country:
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/countries/CountryCodes.xml
  first_name:
    # GROBID splits each name-file line on tab and hyphen, taking the first component.
    # e.g. "Mary-Ann" → "mary" only. Enable here to match that behaviour.
    split_on_hyphen: true
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/firstname.5k
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/names.female
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/names.male
  last_name:
    split_on_hyphen: true
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/lastname.5k
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/names/names.family
  common_name:
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/wordforms/english.wf
  location_name:
    paths:
      - https://raw.githubusercontent.com/kermitt2/grobid/0.9.0/grobid-home/lexicon/places/location.txt
processors:
  fulltext:
    noise_filter_enabled: true
    noise_filter_repetition_fraction: 0.5
    noise_filter_preserve_first_page_head: false
    noise_filter_preserve_first_page_foot: false
    merge_raw_authors: false
    use_cv_model: false
    cv_render_dpi: 100
    use_ocr_model: false
    replace_text_by_cv_graphic: false
    max_graphic_distance: 0.3
models:
  segmentation:
    path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/biorxiv-grobid/2021-05-11-delft-grobid-segmentation-biorxiv-10k-auto-v0.0.23-train-1966-e133.tar.gz'
    use_first_token_of_block: false
  header:
    path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/v0.0.1/2020-10-04-delft-grobid-header-biorxiv-no-word-embedding.tar.gz'
  name_header:
    # path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/grobid-0.6.1/2021-06-21-grobid-0.6.1-name-header-no-word-embedding-no-layout-features-e800.tar.gz'
    path: 'https://github.com/kermitt2/grobid/raw/0.6.0/grobid-home/models/name/header'
    engine: 'wapiti'
  name_citation:
    # path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/grobid-0.6.1/2021-06-28-grobid-0.6.1-name-citation-no-word-embedding-no-layout-features-e500.tar.gz'
    path: 'https://github.com/kermitt2/grobid/raw/0.6.2/grobid-home/models/name/citation'
    engine: 'wapiti'
  affiliation_address:
    path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/v0.0.1/2020-10-04-delft-grobid-affiliation-address-biorxiv-no-word-embedding.tar.gz'
  fulltext:
    path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/biorxiv-grobid/2021-05-11-delft-grobid-fulltext-biorxiv-10k-auto-v0.0.21-train-1986-e159.tar.gz'
  figure:
    path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/biorxiv-grobid/2021-05-11-delft-grobid-figure-biorxiv-10k-auto-v0.0.18-train-1865-e219.tar.gz'
  table:
    path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/biorxiv-grobid/2021-05-11-delft-grobid-table-biorxiv-10k-auto-v0.0.18-train-1865-e569.tar.gz'
  reference_segmenter:
    path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/v0.0.1/2020-10-04-delft-grobid-reference-segmenter-biorxiv-no-word-embedding.tar.gz'
  citation:
    path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/v0.0.1/2020-10-04-delft-grobid-citation-biorxiv-no-word-embedding.tar.gz'

sequence_model_profiles:
  biorxiv_elife:
    segmentation:
      path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/biorxiv-grobid/2021-05-11-delft-grobid-segmentation-biorxiv-10k-auto-v0.0.23-train-1966-e133.tar.gz'
      use_first_token_of_block: false
    header:
      path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/v0.0.1/2020-10-04-delft-grobid-header-biorxiv-no-word-embedding.tar.gz'
    name_header:
      path: 'https://github.com/kermitt2/grobid/raw/0.6.0/grobid-home/models/name/header'
      engine: 'wapiti'
    name_citation:
      path: 'https://github.com/kermitt2/grobid/raw/0.6.2/grobid-home/models/name/citation'
      engine: 'wapiti'
    affiliation_address:
      path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/v0.0.1/2020-10-04-delft-grobid-affiliation-address-biorxiv-no-word-embedding.tar.gz'
    fulltext:
      path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/biorxiv-grobid/2021-05-11-delft-grobid-fulltext-biorxiv-10k-auto-v0.0.21-train-1986-e159.tar.gz'
    figure:
      path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/biorxiv-grobid/2021-05-11-delft-grobid-figure-biorxiv-10k-auto-v0.0.18-train-1865-e219.tar.gz'
    table:
      path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/biorxiv-grobid/2021-05-11-delft-grobid-table-biorxiv-10k-auto-v0.0.18-train-1865-e569.tar.gz'
    reference_segmenter:
      path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/v0.0.1/2020-10-04-delft-grobid-reference-segmenter-biorxiv-no-word-embedding.tar.gz'
    citation:
      path: 'https://github.com/eLifePathways/sciencebeam-models/releases/download/v0.0.1/2020-10-04-delft-grobid-citation-biorxiv-no-word-embedding.tar.gz'
  grobid_crf_0_9_0:
    segmentation:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/segmentation'
      engine: 'wapiti'
      use_first_token_of_block: true
    header:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/header'
      engine: 'wapiti'
      persist_indentation_reference_across_blocks: true
    name_header:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/name/header'
      engine: 'wapiti'
    name_citation:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/name/citation'
      engine: 'wapiti'
    affiliation_address:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/affiliation-address'
      engine: 'wapiti'
    fulltext:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/fulltext'
      engine: 'wapiti'
    figure:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/figure'
      engine: 'wapiti'
    table:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/table'
      engine: 'wapiti'
    reference_segmenter:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/reference-segmenter'
      engine: 'wapiti'
    citation:
      path: 'https://github.com/kermitt2/grobid/raw/0.9.0/grobid-home/models/citation'
      engine: 'wapiti'
  grobid_custom_hybrid:
    extends: grobid_crf_0_9_0
  # Opt-in only: select with SCIENCEBEAM_PARSER__PROFILE, never by default.
  # Requires an api key in SCIENCEBEAM_LLM_API_KEY or OPENROUTER_API_KEY.
  # One profile per model so a failure can be attributed, plus a combined one.
  llm_reference_segmenter:
    extends: grobid_crf_0_9_0
    reference_segmenter:
      engine: 'llm'
      task: 'reference_segmenter'
      response_shape: 'lines'
      model: 'qwen/qwen3.5-9b'
      provider: 'siliconflow'
      prompt_version: 'lines-v2'
      reasoning: 'off'
  llm_citation:
    extends: grobid_crf_0_9_0
    citation:
      engine: 'llm'
      task: 'citation'
      response_shape: 'values'
      model: 'qwen/qwen3.5-9b'
      provider: 'siliconflow'
      prompt_version: 'values-v3'
      reasoning: 'off'
      # References of a document arrive in one call to the engine, which sends
      # them in batches. Decode cost is linear in output tokens however they are
      # grouped, so a larger batch does not generate less — it generates the same
      # amount in one long stream that cannot be overlapped, and long generations
      # are what draw provider timeouts. More, smaller batches run concurrently
      # instead: 4 calls took 111s sequentially and 58s at 4 concurrent, with the
      # same accuracy. Lower the concurrency if the provider answers with 429s.
      max_references_per_request: 10
      max_concurrent_requests: 4
  llm_references:
    extends: llm_reference_segmenter
    citation:
      engine: 'llm'
      task: 'citation'
      response_shape: 'values'
      model: 'qwen/qwen3.5-9b'
      provider: 'siliconflow'
      prompt_version: 'values-v3'
      reasoning: 'off'
      # References of a document arrive in one call to the engine, which sends
      # them in batches. Decode cost is linear in output tokens however they are
      # grouped, so a larger batch does not generate less — it generates the same
      # amount in one long stream that cannot be overlapped, and long generations
      # are what draw provider timeouts. More, smaller batches run concurrently
      # instead: 4 calls took 111s sequentially and 58s at 4 concurrent, with the
      # same accuracy. Lower the concurrency if the provider answers with 429s.
      max_references_per_request: 10
      max_concurrent_requests: 4

profiles:
  biorxiv_elife:
    sequence_models: biorxiv_elife
  grobid_crf_0_9_0:
    sequence_models: grobid_crf_0_9_0
    processors:
      fulltext:
        noise_filter_enabled: false
  grobid_custom_hybrid:
    sequence_models: grobid_custom_hybrid
    processors:
      fulltext:
        noise_filter_enabled: false
  llm_reference_segmenter:
    sequence_models: llm_reference_segmenter
    processors:
      fulltext:
        noise_filter_enabled: false
  llm_citation:
    sequence_models: llm_citation
    processors:
      fulltext:
        noise_filter_enabled: false
  llm_references:
    sequence_models: llm_references
    processors:
      fulltext:
        noise_filter_enabled: false

profile_aliases:
  grobid_crf: grobid_crf_0_9_0

profile: grobid_crf

cv_models:
  default:
    path: 'lp://efficientdet/PubLayNet'
    engine: 'layout_parser'
    score_threshold: 0.1

ocr_models:
  default:
    engine: 'tesserocr'
    lang: 'eng'
    # see https://github.com/sirfz/tesserocr/blob/v2.5.2/tesserocr.pyx#L75-L90
    # (specify literal or int value)
    oem: 'DEFAULT'
    # see https://github.com/sirfz/tesserocr/blob/v2.5.2/tesserocr.pyx#L102-L121
    # (specify literal or int value)
    psm: 'SPARSE_TEXT'

doc_to_pdf:
  enabled: true
  listener:
    port: 2003
    process_timeout: 600
    max_uptime: 10
  convert:
    remove_line_no: true
    remove_header_footer: true
    remove_redline: true

output:
  pretty_print_xml: true

# preload resources and models on startup
preload_on_startup: false
