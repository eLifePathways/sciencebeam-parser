      - suffix_3
      - suffix_4
      - block_status
      - line_status
      - alignment
      - token_font_status
      - token_font_size
      - is_bold
      - is_italic
      - capitalisation
      - digit_status
      - is_single_char
      - punctuation_type
      - relative_document_position
      - relative_page_position
      - is_bitmap_around
      - callout_type
      - is_callout_known
